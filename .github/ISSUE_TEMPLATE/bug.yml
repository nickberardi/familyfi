name: Bug
description: Something is wrong in FamilyFi
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / image tag
