version: 2
# Every ecosystem's updates, majors included, arrive together as one PR a week, which
# dependabot-auto-merge.yml merges once main's required checks pass.
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    multi-ecosystem-group: weekly
    patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    multi-ecosystem-group: weekly
    patterns: ["*"]
  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly
    multi-ecosystem-group: weekly
    patterns: ["*"]
