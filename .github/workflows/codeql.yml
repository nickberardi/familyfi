name: CodeQL

# Static analysis of the JavaScript and TypeScript, on pull requests and weekly so new
# queries run against code that has not changed. Findings land in the repository's
# code scanning alerts.
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: self-hosted
    # Uploading results is this job's only write, and no other job gets it.
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
