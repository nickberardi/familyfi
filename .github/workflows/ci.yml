name: CI

on:
#  push:
#    branches:
#    - main
  pull_request:
    branches:
    - main
  workflow_call:
    
jobs:
  verify:
    runs-on: [self-hosted, Linux, X64]
    env:
      FAMILYFI_DEFAULT_PASSWORD: ci-recovery-password
      FAMILYFI_SESSION_SECRET: ci-only-session-secret-32chars!!
      FAMILYFI_ENCRYPTION_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
      DB_MODE: external
      DB_HOST: 127.0.0.1
      POSTGRES_DB: familyfi_test
      POSTGRES_USER: familyfi
      POSTGRES_PASSWORD: familyfi-ci
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/runner-cleanup
      - name: Postgres
        run: |
          set -euo pipefail
          name="familyfi-pg-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          docker rm -f "$name" >/dev/null 2>&1 || true
          docker run -d --name "$name" \
            -e POSTGRES_USER=familyfi \
            -e POSTGRES_PASSWORD=familyfi-ci \
            -e POSTGRES_DB=familyfi_test \
            -p 127.0.0.1::5432 \
            postgres:18
          ready=0
          for _ in $(seq 1 30); do
            if docker exec "$name" pg_isready -U familyfi -d familyfi_test; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          port=$(docker port "$name" 5432 | head -n 1 | awk -F: '{print $NF}')
          echo "POSTGRES_PORT=$port" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Known high or critical advisories in what ships, not in dev tooling.
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test-api
      - run: node scripts/with-env.mjs ./node_modules/.bin/prisma migrate deploy
      # Exit 2 when schema.prisma differs from what the migrations built: a schema edit with no migration.
      - run: pnpm db-drift
      # Build a database from every supported release's migrations, fill it, and upgrade it to these,
      # so a household that skipped releases is covered. About 30 seconds, so it runs on every push.
      - run: pnpm db-upgrade
      # Unit and integration tests in one run, failing if coverage drops below its floors.
      - run: pnpm test:coverage
      # The unit suite again with the server clock at UTC+14: household time must never lean on the server's zone.
      - run: pnpm test
        env:
          TZ: Pacific/Kiritimati
      # Fails on a changed line no test runs in a gated path (GATED_PATHS in the script); elsewhere it reports.
      - name: Changed-line coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --quiet --depth=1 origin "$BASE_REF"
          node scripts/changed-line-coverage.mjs FETCH_HEAD "$GITHUB_STEP_SUMMARY"
      - run: pnpm build
      - if: always()
        name: Stop Postgres
        run: docker rm -f "familyfi-pg-${GITHUB_RUN_ID}-${GITHUB_JOB}" >/dev/null 2>&1 || true

  browser:
    runs-on: [self-hosted, Linux, X64]
    env:
      CI: "1"
      FAMILYFI_DEFAULT_PASSWORD: ci-recovery-password
      FAMILYFI_SESSION_SECRET: ci-only-session-secret-32chars!!
      FAMILYFI_ENCRYPTION_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
      DB_MODE: external
      DB_HOST: 127.0.0.1
      POSTGRES_DB: familyfi_test
      POSTGRES_USER: familyfi
      POSTGRES_PASSWORD: familyfi-ci
      PLAYWRIGHT_PORT: "3100"
      UNIFI_MOCK: "1"
      CLOUDFLARED_BIN: ${{ github.workspace }}/tests/fixtures/cloudflared/cloudflared
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/runner-cleanup
      - name: Postgres
        run: |
          set -euo pipefail
          name="familyfi-pg-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          docker rm -f "$name" >/dev/null 2>&1 || true
          docker run -d --name "$name" \
            -e POSTGRES_USER=familyfi \
            -e POSTGRES_PASSWORD=familyfi-ci \
            -e POSTGRES_DB=familyfi_test \
            -p 127.0.0.1::5432 \
            postgres:18
          ready=0
          for _ in $(seq 1 30); do
            if docker exec "$name" pg_isready -U familyfi -d familyfi_test; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          port=$(docker port "$name" 5432 | head -n 1 | awk -F: '{print $NF}')
          echo "POSTGRES_PORT=$port" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/with-env.mjs ./node_modules/.bin/prisma migrate deploy
      - run: pnpm build
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test:browser
      # Traces, screenshots and error context for whatever failed, to open with `playwright show-trace`.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - if: always()
        name: Stop Postgres
        run: docker rm -f "familyfi-pg-${GITHUB_RUN_ID}-${GITHUB_JOB}" >/dev/null 2>&1 || true
