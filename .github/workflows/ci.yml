name: CI

on:
#  push:
#    branches:
#    - main
  pull_request:
    branches:
    - main
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
    
jobs:
  # Each job calls scripts/test.py, which starts and removes its own PostgreSQL containers.
  verify:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request's merge commit and its first parent, the base branch.
          fetch-depth: 2
      - uses: ./.github/actions/runner-cleanup
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      # Audit: known high or critical advisories in what ships.
      - run: scripts/test.py check audit lint typecheck api catalog
      # db-drift: exit 2 when schema.prisma differs from what the migrations built. db-upgrade: a
      # database from every supported release upgraded to these migrations, so a household that
      # skipped releases is covered. A pull request runs them only when it changes their inputs;
      # a release runs them always.
      - id: changes
        if: github.event_name == 'pull_request'
        run: |
          # Without the base commit, run them rather than skip them.
          if ! git rev-parse --verify --quiet HEAD^1 >/dev/null ||
            git diff --name-only HEAD^1 HEAD | grep -qE '^(prisma/|prisma\.config\.ts|scripts/test\.py|scripts/ci/check-migration-upgrade\.mjs|scripts/runtime/|scripts/testing/|package\.json|pnpm-lock\.yaml|\.github/workflows/ci\.yml)'; then
            echo "database=true" >> "$GITHUB_OUTPUT"
          fi
      - if: github.event_name != 'pull_request' || steps.changes.outputs.database == 'true'
        run: scripts/test.py check db-drift db-upgrade
      # Unit, integration and harness tests in one run, failing if coverage drops below its floors.
      - id: tests
        run: scripts/test.py run --platform host --coverage
      # Fails on a changed line no test runs in a gated path (GATED_PATHS in the script); elsewhere it reports.
      - name: Changed-line coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          RUN_ID: ${{ steps.tests.outputs.run_id }}
        run: |
          git fetch --quiet --depth=1 origin "$BASE_REF"
          scripts/test.py check coverage --run-id "$RUN_ID" --base FETCH_HEAD
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-results
          path: |
            build/test-runs/**/results.json
            build/test-runs/**/summary.md
            build/test-runs/**/plan.json
            build/test-runs/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  # Also the UTC+14 unit replay, which keeps verify, the longer job, shorter.
  browser:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/runner-cleanup
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      # A production build (the only one this workflow makes), then desktop and phone, each against its own
      # database and server.
      - run: scripts/test.py run --layer ui
      # The unit suite again with the server clock at UTC+14: household time must never lean on the server's zone.
      # It runs even when a browser test failed, so one failure never hides the other.
      - if: ${{ !cancelled() }}
        run: scripts/test.py run --platform host --layer unit --timezone Pacific/Kiritimati
      # Traces, screenshots and error context for whatever failed, to open with `playwright show-trace`.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            build/test-runs/**/results.json
            build/test-runs/**/summary.md
            build/test-runs/**/*.log
            build/test-runs/**/test-results/**
          if-no-files-found: ignore
          retention-days: 7
