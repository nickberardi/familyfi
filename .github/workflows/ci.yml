name: CI

on:
#  push:
#    branches:
#    - main
  # familyfi-mobile-migration collects the native app's shared-code PRs until the migration merges
  # to main; its PRs and merges get the same checks. Remove it from here, container.yml and
  # openapi.yml when it merges.
  push:
    branches:
    - familyfi-mobile-migration
  pull_request:
    branches:
    - main
    - familyfi-mobile-migration
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
    
jobs:
  # Each job calls scripts/test.py, which starts and removes its own PostgreSQL containers.
  verify:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/runner-cleanup
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      # Audit: known high or critical advisories in what ships. db-drift: exit 2 when schema.prisma
      # differs from what the migrations built. db-upgrade: a database from every supported
      # release upgraded to these migrations, so a household that skipped releases is covered.
      - run: scripts/test.py check audit lint typecheck api db-drift db-upgrade catalog
      # Unit, integration and harness tests in one run, failing if coverage drops below its floors.
      - id: tests
        run: scripts/test.py run --platform host --coverage
      # The unit suite again with the server clock at UTC+14: household time must never lean on the server's zone.
      - run: scripts/test.py run --platform host --layer unit --timezone Pacific/Kiritimati
      # Fails on a changed line no test runs in a gated path (GATED_PATHS in the script); elsewhere it reports.
      - name: Changed-line coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          RUN_ID: ${{ steps.tests.outputs.run_id }}
        run: |
          git fetch --quiet --depth=1 origin "$BASE_REF"
          scripts/test.py check coverage --run-id "$RUN_ID" --base FETCH_HEAD
      - run: scripts/test.py build
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-results
          path: |
            build/test-runs/**/results.json
            build/test-runs/**/summary.md
            build/test-runs/**/plan.json
            build/test-runs/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  browser:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/runner-cleanup
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      # A production build, then desktop and phone, each against its own database and server.
      - run: scripts/test.py run --layer ui
      # Traces, screenshots and error context for whatever failed, to open with `playwright show-trace`.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            build/test-runs/**/results.json
            build/test-runs/**/summary.md
            build/test-runs/**/*.log
            build/test-runs/**/test-results/**
          if-no-files-found: ignore
          retention-days: 7
