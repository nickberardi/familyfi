name: CI

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_call:
    
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: familyfi
          POSTGRES_PASSWORD: familyfi-ci
          POSTGRES_DB: familyfi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U familyfi -d familyfi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FAMILYFI_DEFAULT_PASSWORD: ci-recovery-password
      FAMILYFI_SESSION_SECRET: ci-only-session-secret-32chars!!
      FAMILYFI_ENCRYPTION_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
      DB_MODE: external
      DB_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: familyfi_test
      POSTGRES_USER: familyfi
      POSTGRES_PASSWORD: familyfi-ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test-api
      - run: node scripts/with-env.mjs ./node_modules/.bin/prisma migrate deploy
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: familyfi
          POSTGRES_PASSWORD: familyfi-ci
          POSTGRES_DB: familyfi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U familyfi -d familyfi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "1"
      FAMILYFI_DEFAULT_PASSWORD: ci-recovery-password
      FAMILYFI_SESSION_SECRET: ci-only-session-secret-32chars!!
      FAMILYFI_ENCRYPTION_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
      DB_MODE: external
      DB_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: familyfi_test
      POSTGRES_USER: familyfi
      POSTGRES_PASSWORD: familyfi-ci
      PLAYWRIGHT_PORT: "3100"
      UNIFI_MOCK: "1"
      CLOUDFLARED_BIN: ${{ github.workspace }}/tests/fixtures/cloudflared/cloudflared
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/with-env.mjs ./node_modules/.bin/prisma migrate deploy
      - run: pnpm build
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test:browser
