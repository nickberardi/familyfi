name: CI

on:
#  push:
#    branches:
#    - main
  pull_request:
    branches:
    - main
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
    
jobs:
  # Whether a pull request changes anything but documentation. One that changes only prose needs no
  # build, tests or database (docs/testing.md, "Documentation only"), so the jobs below skip, and a job
  # skipped by its `if` reports success to a required check. A file a test reads stays code: AGENTS.md
  # (tests/unit/invariants.test.ts), .claude/agents/ (tests/unit/reviewer-agents.test.ts) and
  # tests/ (tests/unit/repository-hygiene.test.ts), and so does openapi/agent-guide.md, which a route
  # serves. A changed file holding a private key runs everything, so that hygiene test still catches it.
  # A release (workflow_call), and a run where this job cannot decide or fails, runs everything.
  # tests/unit/ci-scripts.test.ts keeps the allowlist away from the files tests read.
  changes:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-24.04' }}
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull request's merge commit and its first parent, the base branch.
          fetch-depth: 2
      - uses: ./.github/actions/runner-cleanup
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # Without the base commit, run everything rather than skip it.
          if [[ "$EVENT" != pull_request ]] || ! git rev-parse --verify --quiet HEAD^1 >/dev/null; then
            echo "code=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          # Both sides of a rename: moving code into docs/ is still a code change.
          files="$(git diff --no-renames --name-only HEAD^1 HEAD)"
          docs='^(docs/.*\.(md|png)|(README|CONTRIBUTING|SECURITY|CLAUDE)\.md|scripts/README\.md|\.github/PULL_REQUEST_TEMPLATE\.md|\.agents/skills/.*\.md)$'
          added="$(git diff --no-renames HEAD^1 HEAD)"
          if [[ -n "$files" ]] && ! grep -vqE "$docs" <<<"$files" &&
            ! grep -qE '^\+.*-----BEGIN [A-Z ]*PRIVATE KEY-----' <<<"$added"; then
            echo "code=false" >>"$GITHUB_OUTPUT"
            echo "Only documentation changed, so the build and tests were skipped." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "code=true" >>"$GITHUB_OUTPUT"
          fi
          echo "Changed files:"; echo "$files"

  # The API contract's floors, first and in minutes: a pull request that forgot to raise one fails
  # here and never starts the half-hour jobs (docs/api.md, "Versioning the contract").
  contract:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit: the base branch to compare with, and the commit that set x-min-app.
          fetch-depth: 0
      - uses: ./.github/actions/runner-cleanup
      # Node first: pnpm/action-setup bootstraps with the npm on PATH, and the runner's own
      # Node has a broken npm since runner 2.338.0.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      # A release has no base branch of its own: it compares main with itself.
      - run: scripts/test.py check api-floors --base "origin/${{ github.base_ref || 'main' }}"
      # The oldest app x-min-app claims, against what this server sends, on the in-memory database.
      - run: scripts/test.py run tests/integration/min-app.test.ts --database memory
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: contract-results
          path: |
            build/test-runs/**/results.json
            build/test-runs/**/summary.md
            build/test-runs/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  # Each job calls scripts/test.py, which starts and removes its own PostgreSQL containers.
  verify:
    needs: contract
    # Explicit: a bare `if` would also skip this when `changes` failed, which a required check reads as success.
    if: ${{ !cancelled() && needs.contract.result == 'success' }}
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit: the merge commit's first parent, for the database checks' change detection,
          # the base branch, for changed-line coverage, the commit tests/integration/min-app.test.ts
          # reads, and the release commits db-upgrade extracts its start points from.
          fetch-depth: 0
      - uses: ./.github/actions/runner-cleanup
      # Node first: pnpm/action-setup bootstraps with the npm on PATH, and the runner's own
      # Node has a broken npm since runner 2.338.0.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - id: install
        run: pnpm install --frozen-lockfile
      # Unit, integration and harness tests in one run, failing if coverage drops below its floors.
      - id: tests
        run: scripts/test.py run --platform host --coverage
      # Fails on a changed line no test runs in a gated path (GATED_PATHS in the script); elsewhere it reports.
      - name: Changed-line coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          RUN_ID: ${{ steps.tests.outputs.run_id }}
        run: |
          git fetch --quiet --depth=1 origin "$BASE_REF"
          scripts/test.py check coverage --run-id "$RUN_ID" --base FETCH_HEAD
      # db-drift: exit 2 when schema.prisma differs from what the migrations built. db-upgrade: a
      # database from every supported release upgraded to these migrations, so a household that
      # skipped releases is covered. A pull request runs them only when it changes their inputs;
      # a release runs them always. They run even when a test failed, so one failure never hides the other.
      - id: changes
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name == 'pull_request' }}
        run: |
          # Without the base commit, run them rather than skip them.
          if ! git rev-parse --verify --quiet HEAD^1 >/dev/null ||
            git diff --name-only HEAD^1 HEAD | grep -qE '^(prisma/|prisma\.config\.ts|scripts/test\.py|scripts/ci/check-migration-upgrade\.mjs|scripts/runtime/|scripts/testing/|package\.json|pnpm-lock\.yaml|\.github/workflows/ci\.yml)'; then
            echo "database=true" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ !cancelled() && steps.install.outcome == 'success' && (github.event_name != 'pull_request' || steps.changes.outputs.database == 'true') }}
        run: scripts/test.py check db-drift db-upgrade
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-results
          path: |
            build/test-runs/**/results.json
            build/test-runs/**/summary.md
            build/test-runs/**/plan.json
            build/test-runs/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  # Also the static checks and the UTC+14 unit replay, which keep verify, the longer job, shorter:
  # verify's coverage run takes about seven minutes, this job's browser run about five.
  browser:
    needs: contract
    # Explicit: a bare `if` would also skip this when `changes` failed, which a required check reads as success.
    if: ${{ !cancelled() && needs.contract.result == 'success' }}
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/runner-cleanup
      # Node first: pnpm/action-setup bootstraps with the npm on PATH, and the runner's own
      # Node has a broken npm since runner 2.338.0.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - id: install
        run: pnpm install --frozen-lockfile
      - id: chromium
        run: pnpm exec playwright install chromium
      # Audit: known high or critical advisories in what ships.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: scripts/test.py check audit lint typecheck api catalog
      # A production build (the only one this workflow makes), then desktop and phone, each against its own
      # database and server. It runs even when a check above failed, so one failure never hides the other.
      - if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: scripts/test.py run --layer ui
      # The image ships this build's standalone output (docker/Dockerfile). A filesystem or spawn call the
      # bundler cannot scope traces the whole repository into it, which check-image.sh only sees at release.
      - if: ${{ !cancelled() }}
        run: |
          for dir in scripts docs .github; do
            if [ -e ".next/standalone/$dir" ]; then
              echo "::error::.next/standalone contains $dir/: a dynamic fs or spawn call traced the whole repository (see next build's warnings)"
              exit 1
            fi
          done
      # The unit suite again with the server clock at UTC+14: household time must never lean on the server's zone.
      # It runs even when a browser test failed, so one failure never hides the other.
      - if: ${{ !cancelled() }}
        run: scripts/test.py run --platform host --layer unit --timezone Pacific/Kiritimati
      # Traces, screenshots and error context for whatever failed, to open with `playwright show-trace`.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            build/test-runs/**/results.json
            build/test-runs/**/summary.md
            build/test-runs/**/*.log
            build/test-runs/**/test-results/**
          if-no-files-found: ignore
          retention-days: 7
