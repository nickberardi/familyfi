name: OpenAPI

# Only when the contract changes. Label changes re-run it, so adding or removing
# `breaking_api` takes effect without a new push.
on:
  pull_request:
    branches:
      - main
    paths:
      - openapi/**
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  # info.version must rise with every change, so the iOS client can tell its vendored copy is stale.
  version:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Version against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
          BREAKING_API_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'breaking_api') }}
        run: node scripts/check-openapi-version.mjs

  breaking:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - name: Breaking changes against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
          BREAKING_API_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'breaking_api') }}
        run: sh scripts/check-openapi-breaking.sh
