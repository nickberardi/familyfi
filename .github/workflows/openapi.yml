name: OpenAPI

# Only when the contract changes. Label changes re-run it, so adding or removing
# `breaking_api` takes effect without a new push.
on:
  pull_request:
    branches:
      - main
    paths:
      - openapi/**
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # info.version must rise with every change, so each familyfi-mobile pin names its contract revision.
  version:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/runner-cleanup
      # Node first: pnpm/action-setup bootstraps with the npm on PATH, and the runner's own
      # Node has a broken npm since runner 2.338.0.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.15.1
          # A self-hosted runner keeps its own store (scripts/ci/runner-cleanup.sh).
          cache: ${{ runner.environment != 'self-hosted' }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Version against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
          BREAKING_API_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'breaking_api') }}
        run: node scripts/ci/check-openapi-version.mjs

  breaking:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/runner-cleanup
      - name: Breaking changes against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
          BREAKING_API_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'breaking_api') }}
        run: sh scripts/ci/check-openapi-breaking.sh
