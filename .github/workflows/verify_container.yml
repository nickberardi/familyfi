name: CI

on:
  workflow_dispatch:
    
jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: familyfi:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image hygiene
        run: sh scripts/check-image.sh familyfi:ci
      - name: Container smoke
        env:
          FAMILYFI_IMAGE: familyfi:ci
        run: sh scripts/container-smoke.sh
