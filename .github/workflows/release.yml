name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  on-main:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    outputs:
      published: ${{ steps.local.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/runner-cleanup
      - name: Tag points at a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # scripts/release.sh pushes this version's image before it creates the Release that created
      # this tag, and names it by digest in the Release's notes. A Release made on GitHub has no
      # image yet, so it builds as always.
      - name: Published by scripts/release.sh
        id: local
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          body="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" | jq -r '.body // ""')" || body=""
          digest="$(grep -oE "ghcr\.io/$repo@sha256:[0-9a-f]{64}" <<< "$body" | head -n 1 | cut -d@ -f2)" || digest=""
          if [ -z "$digest" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          token=$(curl -sf -u "$GITHUB_ACTOR:$GH_TOKEN" "https://ghcr.io/token?scope=repository:$repo:pull" | jq -r .token)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/$repo/manifests/$digest")
          case "$code" in
            200)
              echo "::notice::$GITHUB_REF_NAME's image ghcr.io/$repo@$digest is already published (scripts/release.sh), so this run builds nothing."
              echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "GHCR answered $code for ghcr.io/$repo@$digest" >&2; exit 1 ;;
          esac

  ci:
    needs: on-main
    if: needs.on-main.outputs.published != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  container:
    needs: on-main
    if: needs.on-main.outputs.published != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/container.yml

  ghcr:
    needs: [ci, container]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ${{ vars.USE_SELF_HOSTED == 'true' && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-24.04' }}
          # Self-hosted, arm64 builds natively on an arm64 runner when SELF_HOSTED_ARM64 is
          # 'true', and otherwise under QEMU on the x64 runners.
          - platform: linux/arm64
            runner: ${{ vars.USE_SELF_HOSTED != 'true' && 'ubuntu-24.04-arm' || vars.SELF_HOSTED_ARM64 == 'true' && fromJSON('["self-hosted","linux","arm64"]') || fromJSON('["self-hosted","linux","x64"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          # SOURCE_DATE_EPOCH below reads when the Dockerfile or lockfile last changed.
          fetch-depth: 0
      - uses: ./.github/actions/runner-cleanup
      - name: Platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          # Every file's time is clamped to this (rewrite-timestamp below), so a layer whose files
          # did not change has the digest it had, and an update does not download it again.
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct -- docker/Dockerfile pnpm-lock.yaml)" >> "$GITHUB_ENV"
      - if: matrix.platform == 'linux/arm64' && runner.arch != 'ARM64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: ./.github/actions/setup-buildx
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: APP_VERSION=${{ env.APP_VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Every release lands on :next as a Pre-release; only promote.yml moves :latest and :X.Y.
  manifest:
    needs: ghcr
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    # Every tag publishes through the one :build tag, so one at a time. GitHub keeps one waiting job
    # per group, so a third release reaching here at once is cancelled: run its job again.
    concurrency:
      group: release-manifest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # Every tag, to tell whether this one is the newest.
          fetch-depth: 0
      - uses: ./.github/actions/runner-cleanup
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # imagetools needs no BuildKit container, so nothing is pulled while sibling jobs start.
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          image="$(echo "$REGISTRY_IMAGE" | tr '[:upper:]' '[:lower:]')"
          # A multi-platform image is published under a tag. :build is that tag for every build and
          # nobody runs it; the release's notes keep this build's digest after the next build moves it.
          tags=(--tag "$image:build")
          # A fix to an older line (v0.39.1 while :next has v0.40.0) must not move :next back to it.
          newest="$(git -C "$GITHUB_WORKSPACE" tag -l 'v*' | node "$GITHUB_WORKSPACE/scripts/ci/newest-tag.mjs")"
          if [ "$newest" = "$GITHUB_REF_NAME" ]; then
            tags+=(--tag "$image:next")
          else
            echo "::notice::$GITHUB_REF_NAME is older than $newest, so :next stays where it is."
          fi
          sources=$(printf "$image@sha256:%s " *)
          # This build's digest from the list it pushes, not read back from :build, which another
          # publish (scripts/release.sh's too) can move: --dry-run prints the bytes create pushes.
          index="$(docker buildx imagetools create --dry-run "${tags[@]}" $sources)"
          digest="sha256:$(printf '%s' "$index" | sha256sum | cut -d' ' -f1)"
          docker buildx imagetools create "${tags[@]}" $sources
          docker buildx imagetools inspect "$image@$digest" >/dev/null ||
            { echo "::error::the list pushed for $GITHUB_REF_NAME is not $digest" >&2; exit 1; }
          echo "IMAGE_REF=$image@$digest" >> "$GITHUB_ENV"
      # The Release, created as a Pre-release, or the one made on GitHub that created this tag, with
      # the image named by digest. promote.yml reads it from there when the Release stops being a
      # Pre-release.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # curl and jq rather than the GitHub CLI, which a self-hosted runner need not have.
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          releases="https://api.github.com/repos/$GITHUB_REPOSITORY/releases"
          header="Image: \`$IMAGE_REF\` (linux/amd64 and linux/arm64). Every release is on \`:next\` first; making it a full release moves \`:latest\` to it.

          Licensed under the Business Source License 1.1. See LICENSE and docs/licensing.md."
          if existing="$(api "$releases/tags/$GITHUB_REF_NAME" 2>/dev/null)"; then
            # Keep what is written there; replace an earlier build's lines.
            body="$(jq -r '.body // ""' <<< "$existing" | sed -e '/^Image: `ghcr\.io\//d' -e '/^Licensed under the Business Source License/d' | sed '/./,$!d')"
            jq -n --arg body "$header"$'\n\n'"$body" '{body: $body}' |
              api -X PATCH --data @- "$releases/$(jq -r .id <<< "$existing")" >/dev/null
          else
            jq -n --arg tag "$GITHUB_REF_NAME" --arg body "$header" \
              '{tag_name: $tag, name: $tag, body: $body, prerelease: true, generate_release_notes: true}' |
              api -X POST --data @- "$releases" >/dev/null
          fi
          echo "::notice::$GITHUB_REF_NAME is $IMAGE_REF"

  # The image reports the tag's version whatever package.json says. When main's package.json
  # and OpenAPI info.version are behind a stable tag, open a PR that brings them up to it.
  version-pr:
    needs: [on-main, manifest]
    if: >-
      always() && !contains(github.ref_name, '-') && needs.on-main.result == 'success' &&
      (needs.on-main.outputs.published == 'true' || needs.manifest.result == 'success')
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # A PR opened with GITHUB_TOKEN starts no workflows, so its checks would never run.
          # RELEASE_PR_TOKEN (contents and pull requests: write) lets them; without it, the PR
          # needs a push or a close and reopen by a person before CI runs.
          token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
      - uses: ./.github/actions/runner-cleanup
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Open a PR when main is behind the tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
        run: |
          # curl and jq rather than the GitHub CLI, which a self-hosted runner need not have.
          pulls="https://api.github.com/repos/$GITHUB_REPOSITORY/pulls"
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          tag_version="${GITHUB_REF_NAME#v}"
          main_version="$(jq -r .version package.json)"
          newest="$(printf '%s\n%s\n' "$main_version" "$tag_version" | sort -V | tail -n 1)"
          if [ "$main_version" = "$tag_version" ] || [ "$newest" = "$main_version" ]; then
            echo "main's package.json is $main_version, not behind $GITHUB_REF_NAME"
            exit 0
          fi
          branch="release/version-$tag_version"
          if [ -n "$(api "$pulls?state=open&head=$GITHUB_REPOSITORY_OWNER:$branch" | jq -r '.[].number')" ]; then
            echo "A PR from $branch is already open"
            exit 0
          fi
          npm pkg set "version=$tag_version"
          node -e '
            const fs = require("fs");
            const file = "openapi/familyfi.v1.yaml";
            const text = fs.readFileSync(file, "utf8");
            const next = text.replace(/^(info:\n(?:[ \t]+.*\n)*?[ \t]+version:[ \t]*)\S+/m, `$1${process.argv[1]}`);
            if (next === text) throw new Error(`no info.version to change in ${file}`);
            fs.writeFileSync(file, next);
          ' "$tag_version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Bump the version to $tag_version" -m "$GITHUB_REF_NAME was released from a commit whose package.json said $main_version."
          git push --force origin "$branch"
          body="$GITHUB_REF_NAME was released with version $tag_version stamped into its image, but main's \`package.json\` and OpenAPI \`info.version\` say $main_version. This brings them up to the release, so the repository shows the version households run."
          jq -n --arg head "$branch" --arg title "Bump the version to $tag_version" --arg body "$body" \
            '{base: "main", head: $head, title: $title, body: $body}' | api -X POST --data @- "$pulls" >/dev/null
