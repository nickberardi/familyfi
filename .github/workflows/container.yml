name: Container

# Not on pull requests or pushes to main: the image build is slow. It gates every
# release (see release.yml) and runs by hand.
on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/runner-cleanup
      - uses: ./.github/actions/setup-buildx
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: familyfi:ci
          # Same scope as release.yml's amd64 build, so a release reuses these layers.
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64
      - name: Image hygiene
        run: sh scripts/ci/check-image.sh familyfi:ci
      - name: Container smoke
        env:
          FAMILYFI_IMAGE: familyfi:ci
        run: sh scripts/ci/container-smoke.sh
