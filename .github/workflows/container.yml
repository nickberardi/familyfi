name: Container

# Pull requests, not pushes to main: the image build is slow and costly in Actions
# minutes, and a merged PR already passed it. It also gates every release (see release.yml).
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: familyfi:ci
          # Same scope as release.yml's amd64 build, so a release reuses these layers.
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64
      - name: Image hygiene
        run: sh scripts/check-image.sh familyfi:ci
      - name: Container smoke
        env:
          FAMILYFI_IMAGE: familyfi:ci
        run: sh scripts/container-smoke.sh
