name: Dependabot auto-merge

# Turns on auto-merge for every Dependabot PR, majors included, so GitHub squashes it once main's
# required checks pass, like any other PR. dependabot.yml puts each weekly scan into one PR.
# Pull requests do not build the image (container.yml runs only for a release), so a Docker base
# image update is first built and smoke-tested by the next release.
# The merge is made with GITHUB_TOKEN, so it starts no workflow on main.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  enable:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            try {
              await github.graphql(
                `mutation($id: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: SQUASH }) { clientMutationId }
                }`,
                { id: context.payload.pull_request.node_id },
              );
            } catch (error) {
              // Checks already green (a reopened PR): there is nothing left to wait for.
              if (!/clean status/i.test(error.message)) throw error;
              core.notice("Checks have already passed; merge this PR by hand.");
            }
