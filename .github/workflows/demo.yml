name: Demo image

# The hosted demo (docs/operations.md#demo-mode) runs main, not the latest release, so App
# Review and the public demo see what is about to ship. Same Dockerfile as a release; only
# FAMILYFI_MODE=demo on the host makes it a demo.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  demo:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/runner-cleanup
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:demo
          # Same scope as container.yml and release.yml's amd64 build, so this reuses their layers.
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64
