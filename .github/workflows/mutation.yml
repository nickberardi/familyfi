name: Mutation

# Mutation testing of the code that decides what a gateway enforces. It reports and never
# gates: see docs/testing.md. Weekly, but only when src/ or tests/ changed in the last
# seven days, since an unchanged week would report the same survivors. Run it by hand
# from the Actions tab at any time.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/runner-cleanup
      - name: Skip a week with no code change
        id: changed
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || git log --since="7 days ago" --format=%H -- src tests | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No change under src/ or tests/ in the last seven days, so mutation testing was skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      # Node first: pnpm/action-setup bootstraps with the npm on PATH, and the runner's own
      # Node has a broken npm since runner 2.338.0.
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - if: steps.changed.outputs.run == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.15.1
          # A self-hosted runner keeps its own store (scripts/ci/runner-cleanup.sh).
          cache: ${{ runner.environment != 'self-hosted' }}
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - if: steps.changed.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      # Stryker against the harness's own PostgreSQL, then the score and survivors in the job summary.
      - if: steps.changed.outputs.run == 'true'
        run: scripts/test.py check mutation
      # The HTML report lists every surviving mutant with its line and the tests that ran.
      - if: steps.changed.outputs.run == 'true' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
