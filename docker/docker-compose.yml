services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-familyfi}
      POSTGRES_USER: ${POSTGRES_USER:-familyfi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    volumes:
      - familyfi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  app:
    image: ${FAMILYFI_IMAGE:-ghcr.io/nickberardi/familyfi:latest}
    ports:
      - "${APP_PORT:-7001}:7001"
    env_file:
      - ../.env
    volumes:
      - ../.env:/app/.env
    environment:
      NODE_ENV: production
      PORT: "7001"
      HOSTNAME: 0.0.0.0
      DB_HOST: db
      DB_PORT: ${POSTGRES_PORT:-5432}
      DB_NAME: ${POSTGRES_DB:-familyfi}
      DB_USER: ${POSTGRES_USER:-familyfi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  familyfi-postgres:
