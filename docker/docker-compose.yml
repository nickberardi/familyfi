services:
  db:
    image: postgres:18-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-familyfi-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-familyfi}
      POSTGRES_USER: ${POSTGRES_USER:-familyfi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - familyfi-postgres:${POSTGRES_DATA_PATH:-/var/lib/postgresql}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: ${FAMILYFI_IMAGE:-ghcr.io/nickberardi/familyfi:latest}
    container_name: ${APP_CONTAINER_NAME:-familyfi-app}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "7001"
      HOSTNAME: 0.0.0.0
      DB_MODE: bundled
      DB_HOST: db
      # PostgreSQL's port inside the Compose network; POSTGRES_PORT only picks the host's published port.
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-familyfi}
      POSTGRES_USER: ${POSTGRES_USER:-familyfi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # The remote access port: the phone-only gateway, for a route the household runs (a router port
      # forward, reverse proxy, Tailscale or its own tunnel) to point at. It answers nothing until
      # Pair Device → Remote access publishes such a route (docs/setup.md).
      FAMILYFI_REMOTE_ACCESS_PORT: ${FAMILYFI_REMOTE_ACCESS_PORT:-7002}
    labels:
      # Watchtower updates this container and no other, after backing up the database. A failed
      # backup exits 75, which makes Watchtower skip the update.
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.lifecycle.pre-update: /app/scripts/runtime/pre-update-backup.sh
      com.centurylinklabs.watchtower.lifecycle.pre-update-timeout: "10"
    ports:
      - "${FAMILYFI_PORT:-7001}:7001"
      - "${FAMILYFI_REMOTE_ACCESS_PORT:-7002}:${FAMILYFI_REMOTE_ACCESS_PORT:-7002}"
    volumes:
      - familyfi-app:/var/lib/familyfi/data
      - familyfi-updater:/var/lib/familyfi/updater
    # Healthy once the entrypoint has written the token Watchtower waits for.
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/lib/familyfi/updater/token"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      db:
        condition: service_healthy

  # Installs newer FamilyFi releases when FamilyFi asks: Install on the Update page, or its schedule.
  # It alone holds the Docker socket, publishes no port and polls nothing on its own. Its token is
  # the one FamilyFi generated into the updater volume, read here read-only. The original
  # containrrr/watchtower was archived in December 2025; this is the maintained fork. Run without it
  # with `docker compose up -d db app`.
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: ${WATCHTOWER_CONTAINER_NAME:-familyfi-watchtower}
    restart: unless-stopped
    environment:
      # A path: Watchtower reads the token from the file.
      WATCHTOWER_HTTP_API_TOKEN: /run/familyfi-updater/token
      WATCHTOWER_HTTP_API_ENDPOINTS: update,history
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "false"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_LIFECYCLE_HOOKS: "true"
      WATCHTOWER_CLEANUP: "true"
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - familyfi-updater:/run/familyfi-updater:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  familyfi-postgres:
    driver: local
    name: ${POSTGRES_VOLUME_NAME:-familyfi-postgres_data}
  familyfi-app:
    driver: local
    name: ${APP_DATA_VOLUME_NAME:-familyfi-app_data}
  familyfi-updater:
    driver: local
    name: ${UPDATER_VOLUME_NAME:-familyfi-updater_data}
