services:
  db:
    image: postgres:18-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-familyfi-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-familyfi}
      POSTGRES_USER: ${POSTGRES_USER:-familyfi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - familyfi-postgres:${POSTGRES_DATA_PATH:-/var/lib/postgresql}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: ${FAMILYFI_IMAGE:-ghcr.io/nickberardi/familyfi:latest}
    container_name: ${APP_CONTAINER_NAME:-familyfi-app}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "7001"
      HOSTNAME: 0.0.0.0
      DB_MODE: bundled
      DB_HOST: db
      # PostgreSQL's port inside the Compose network; POSTGRES_PORT only picks the host's published port.
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-familyfi}
      POSTGRES_USER: ${POSTGRES_USER:-familyfi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Set to expose the phone-only gateway to a tunnel sidecar on this Compose network
      # (see docs/setup.md). Never add it to `ports`.
      FAMILYFI_PHONE_GATEWAY_PORT: ${FAMILYFI_PHONE_GATEWAY_PORT:-}
      # Set to let FamilyFi install releases through the watchtower service below (docs/setup.md).
      FAMILYFI_UPDATER_TOKEN: ${FAMILYFI_UPDATER_TOKEN:-}
    labels:
      # Watchtower updates this container and no other, after backing up the database. A failed
      # backup exits 75, which makes Watchtower skip the update.
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.lifecycle.pre-update: /app/scripts/runtime/pre-update-backup.sh
      com.centurylinklabs.watchtower.lifecycle.pre-update-timeout: "10"
    ports:
      - "${FAMILYFI_PORT:-7001}:7001"
    volumes:
      - familyfi-app:/var/lib/familyfi/data
    depends_on:
      db:
        condition: service_healthy

  # Installs newer FamilyFi releases when FamilyFi asks (Update page, or its schedule). Opt in with
  # `docker compose --profile updater up -d` and FAMILYFI_UPDATER_TOKEN in .env. It alone holds the
  # Docker socket, publishes no port and polls nothing on its own. The original containrrr/watchtower
  # was archived in December 2025; this is the maintained fork, pinned by digest.
  watchtower:
    image: nickfedor/watchtower:1.23.0@sha256:45b54f6dc15227cfb38dbb826f2881aa0f56aaf0c255cdbb38bd80e598bdca9a
    container_name: ${WATCHTOWER_CONTAINER_NAME:-familyfi-watchtower}
    profiles: [updater]
    restart: unless-stopped
    environment:
      # Watchtower refuses to start the update endpoint without a token.
      WATCHTOWER_HTTP_API_TOKEN: ${FAMILYFI_UPDATER_TOKEN:-}
      WATCHTOWER_HTTP_API_ENDPOINTS: update,history
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "false"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_LIFECYCLE_HOOKS: "true"
      WATCHTOWER_CLEANUP: "true"
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  familyfi-postgres:
    driver: local
    name: ${POSTGRES_VOLUME_NAME:-familyfi-postgres_data}
  familyfi-app:
    driver: local
    name: ${APP_DATA_VOLUME_NAME:-familyfi-app_data}
