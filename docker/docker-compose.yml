services:
  db:
    image: postgres:18-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-familyfi-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-familyfi}
      POSTGRES_USER: ${POSTGRES_USER:-familyfi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - familyfi-postgres:${POSTGRES_DATA_PATH:-/var/lib/postgresql}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: ${FAMILYFI_IMAGE:-ghcr.io/nickberardi/familyfi:latest}
    container_name: ${APP_CONTAINER_NAME:-familyfi-app}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "7001"
      HOSTNAME: 0.0.0.0
      DB_MODE: bundled
      DB_HOST: db
      DB_PORT: ${POSTGRES_PORT:-5432}
      DB_NAME: ${POSTGRES_DB:-familyfi}
      DB_USER: ${POSTGRES_USER:-familyfi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Must stay stable across container recreates — UniFi API key ciphertext is in Postgres.
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:?Set DEFAULT_PASSWORD in .env (make setup)}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env (make setup)}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in .env (make setup)}
    ports:
      - "${APP_PORT:-7001}:7001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  familyfi-postgres:
    driver: local
    name: ${POSTGRES_VOLUME_NAME:-familyfi-postgres_data}