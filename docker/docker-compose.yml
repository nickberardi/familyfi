services:
  db:
    image: postgres:18-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-familyfi-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-familyfi}
      POSTGRES_USER: ${POSTGRES_USER:-familyfi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - familyfi-postgres:${POSTGRES_DATA_PATH:-/var/lib/postgresql}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: ${FAMILYFI_IMAGE:-ghcr.io/nickberardi/familyfi:latest}
    container_name: ${APP_CONTAINER_NAME:-familyfi-app}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "7001"
      HOSTNAME: 0.0.0.0
      DB_MODE: bundled
      DB_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-familyfi}
      POSTGRES_USER: ${POSTGRES_USER:-familyfi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Autogenerated secrets persist here across recreates. Host env overrides when set.
      FAMILYFI_DATA_DIR: /data
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
    ports:
      - "${APP_PORT:-7001}:7001"
    volumes:
      - familyfi-app-data:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  familyfi-postgres:
    driver: local
    name: ${POSTGRES_VOLUME_NAME:-familyfi-postgres_data}
  familyfi-app-data:
    driver: local
    name: ${APP_DATA_VOLUME_NAME:-familyfi-app_data}
