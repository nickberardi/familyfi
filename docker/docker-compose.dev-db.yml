services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-${POSTGRES_DB:-familyfi}}
      POSTGRES_USER: ${DB_USER:-${POSTGRES_USER:-familyfi}}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-familyfi}}
    ports:
      - "${DB_PORT:-${POSTGRES_PORT:-5432}}:5432"
    volumes:
      - familyfi-dev-postgres:${DB_DATA_PATH:-${POSTGRES_DATA_PATH:-/var/lib/postgresql}}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  familyfi-dev-postgres:
    driver: local
    name: ${DB_VOLUME_NAME:-${POSTGRES_VOLUME_NAME:-familyfi-dev-postgres_data}}