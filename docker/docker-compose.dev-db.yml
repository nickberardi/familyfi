services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-familyfi}
      POSTGRES_USER: ${POSTGRES_USER:-familyfi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-familyfi}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - familyfi-dev-postgres:${POSTGRES_DATA_PATH:-/var/lib/postgresql}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  familyfi-dev-postgres:
    driver: local
    name: ${POSTGRES_VOLUME_NAME:-familyfi-dev-postgres_data}