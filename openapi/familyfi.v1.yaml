          content: { application/json: { schema: { $ref: "#/components/schemas/ConnectionStatus" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/connection/endpoints:
    get:
      operationId: listConnectionEndpoints
      tags: [Connection]
      summary: List every route, with who runs it
      description: |
        Every saved route, enabled or not. Remote access publishes one at a time: the route in
        `GET /api/v1/connection/tunnel` `endpointId` is the only one enabled, and the only one
        phones are handed.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: Endpoints, content: { application/json: { schema: { type: object, required: [endpoints], properties: { endpoints: { type: array, items: { $ref: "#/components/schemas/ConnectionEndpoint" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createConnectionEndpoint
      tags: [Connection]
      summary: Add a route the household runs
      description: |
        Always `kind: own`. Save it with `enabled: false`, then publish it with
        `PUT /api/v1/connection/tunnel` `{ "mode": "named", "endpointId": … }`, which turns every
        other route off. A `cloudflare` route can be put behind Cloudflare Access by sending
        `serviceToken`; any other route is refused with `access_unsupported`.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConnectionEndpointWrite" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, required: [endpoint], properties: { endpoint: { $ref: "#/components/schemas/ConnectionEndpoint" } } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { description: "`endpoint_exists` — another route already uses this address; `access_unsupported` — only a `cloudflare` route can be behind Cloudflare Access", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/connection/endpoints/{id}:
    put:
      operationId: updateConnectionEndpoint
      tags: [Connection]
      summary: Update a route the household runs
      description: |
        A `quick` or `domain` route follows FamilyFi's own tunnel and is refused with `managed_route`;
        change it through `PUT /api/v1/connection/tunnel`. Sending a different `serviceToken`
        replaces the Access token and raises its version; phones pick the new one up from their
        next signed manifest. `edgeAuth: none` turns Access off.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/CsrfToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConnectionEndpointUpdate" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { type: object, required: [endpoint], properties: { endpoint: { $ref: "#/components/schemas/ConnectionEndpoint" } } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "`endpoint_exists` — another route already uses this address; `managed_route` — the route follows FamilyFi's own tunnel; `access_unsupported` — only a `cloudflare` route can be behind Cloudflare Access", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      operationId: deleteConnectionEndpoint
      tags: [Connection]
      summary: Delete a route the household runs
      description: |
        Refused while an unclaimed, unexpired pairing uses the route, and for a `quick` or `domain`
        route (`managed_route`; forget a domain with `PUT /api/v1/connection/tunnel`). Deleting the
        published route turns remote access off. Phones already paired through it keep their other
        routes; their `pairedVia` becomes null.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { type: object, required: [ok], properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "`endpoint_in_use` — a pending pairing uses this route; `managed_route` — the route follows FamilyFi's own tunnel", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/connection/tunnel:
    get:
      operationId: getRemoteAccess
      tags: [Connection]
      summary: Remote access state and the route it publishes
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: Remote access, content: { application/json: { schema: { type: object, additionalProperties: false, required: [tunnel], properties: { tunnel: { $ref: "#/components/schemas/RemoteAccess" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      operationId: setRemoteAccess
      tags: [Connection]
      summary: Choose the one route remote access publishes
      description: |
        Every change publishes exactly one route and turns every other route off; `off` publishes
        none. A tunnel's route is turned on once its tunnel is up, so phones are never handed an
        address nothing answers.

        `quick` starts a Cloudflare quick tunnel to FamilyFi's phone-only gateway, which
        forwards only `/api/v1/*`, strips cookies, and requires a paired phone to sign in.
        FamilyFi keeps one `quick` route pointed at the tunnel's current address.

        `named` is "my domain", in one of two forms:
        - with `endpointId`: publish that `own` route (home network, Tailscale). FamilyFi runs no
          tunnel. A `quick` or `domain` route is refused.
        - with a new `hostname`: a one-time Cloudflare sign-in. Poll GET for `loginUrl`, which a
          person opens to authorize. FamilyFi then creates a tunnel and a DNS record (never
          overwriting an existing one), stores only that tunnel's credential on the `domain`
          route, encrypted with FAMILYFI_ENCRYPTION_KEY, and discards the account-wide certificate.
          Without either, it runs the domain already set up.

        `off` with `forget: true` also deletes the `domain` route and its credential (the tunnel
        and DNS record stay in the Cloudflare account).
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { type: object, additionalProperties: false, required: [mode], properties: { mode: { const: "off" }, forget: { type: boolean } } }
                - { type: object, additionalProperties: false, required: [mode], properties: { mode: { const: quick } } }
                - { type: object, additionalProperties: false, required: [mode], description: "Send `hostname` or `endpointId`, never both.", properties: { mode: { const: named }, hostname: { type: string, maxLength: 253 }, endpointId: { type: string, description: "An `own` route to publish." } } }
      responses:
        "200": { description: Remote access, content: { application/json: { schema: { type: object, additionalProperties: false, required: [tunnel], properties: { tunnel: { $ref: "#/components/schemas/RemoteAccess" } } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/connection/home:
    get:
      operationId: getHomeAddress
      tags: [Connection]
      summary: Where FamilyFi is on the home network
      description: |
        Home access: the inside address, kept apart from the route remote access publishes. It is
        always on. Agents pair at the saved address; without one they pair at the address their
        code was made at, which the web app suggests only when `current.private` is true.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: Home network address, content: { application/json: { schema: { $ref: "#/components/schemas/HomeAddressResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      operationId: setHomeAddress
      tags: [Connection]
      summary: Set or clear the home network address
      description: |
        An http or https origin with no credentials, path, query or fragment (400
        `invalid_home_url` otherwise); `null` or an empty string clears it. It must answer without
        a sign-in page, since agents pair there.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [url], properties: { url: { type: [string, "null"], maxLength: 2048 } } }
      responses:
        "200": { description: Home network address, content: { application/json: { schema: { $ref: "#/components/schemas/HomeAddressResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/connection/pins:
    post:
      operationId: computeConnectionPin
      tags: [Connection]
      summary: Compute the SPKI SHA-256 pin for a pinned LAN route
      description: |
        Send `url` to have FamilyFi complete a TLS handshake with that HTTPS origin and read its leaf
        certificate (no HTTP request is sent), or `certificate` to hash a pasted PEM. The pin is
        base64url SHA-256 of the DER SubjectPublicKeyInfo, identical to
        `openssl x509 -pubkey -noout | openssl pkey -pubin -outform der | openssl dgst -sha256 -binary`
        encoded base64url. Nothing is stored.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { type: object, additionalProperties: false, required: [url], properties: { url: { type: string, format: uri } } }
                - { type: object, additionalProperties: false, required: [certificate], properties: { certificate: { type: string, maxLength: 20000 } } }
      responses:
        "200": { description: Pin, content: { application/json: { schema: { type: object, additionalProperties: false, required: [pin], properties: { pin: { $ref: "#/components/schemas/ConnectionCertificatePin" } } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { description: "`probe_failed` — the address could not be reached or the text is not a certificate", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/paired/invites:
    post:
      operationId: createPairedInvite
      tags: [Paired]
      summary: Invite a device to join, or (claim=true) invite and claim a phone's Watch
      description: |
        Every paired device joins with an invite. An administrator invites a phone (over a
        published route, five minutes) or an agent (on the home network, fifteen minutes) and gets
        a single-use `code`; the device claims it at `POST /paired/invites/{id}/claim`, which signs
        it in. Pairing is the authentication: the invite names the account the device acts as —
        for a phone, `accountId` (default: whoever makes it), which must be an administrator (400
        `administrator_account_required` otherwise); for an agent, whoever makes it.

        With `?claim=true` a signed-in paired phone invites its Watch and claims it in one
        transaction, and the response is the claim: the phone hands the Watch its tokens and
        manifest, and becomes its parent. Only a phone, and only for a Watch (403
        `paired_phone_required` otherwise). A previous Watch with the same `clientId` is revoked.

        An agent invite is refused through remote access (403 `agent_remote`).
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: claim, in: query, required: false, schema: { type: string, enum: ["true"] } }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/PairedInviteCreate"
                - $ref: "#/components/schemas/PairedWatchCreate"
      responses:
        "201":
          description: An invite and its code; with `?claim=true`, the claimed invite and the Watch's claim.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PairedInviteIssued"
                  - $ref: "#/components/schemas/PairedWatchClaimed"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/paired/invites/{id}:
    get:
      operationId: getPairedInvite
      tags: [Paired]
      summary: An invite's status, so the screen that made it can tell when it was claimed
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Invite status, content: { application/json: { schema: { type: object, additionalProperties: false, required: [invite], properties: { invite: { $ref: "#/components/schemas/PairedInviteStatus" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: cancelPairedInvite
      tags: [Paired]
      summary: Cancel a pending invite before it expires
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200": { description: Cancelled, content: { application/json: { schema: { type: object, required: [ok], properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { description: "No pending invite with that id: unknown, claimed, expired, or already cancelled", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/paired/invites/{id}/claim:
    post:
      operationId: claimPairedInvite
      tags: [Paired]
      summary: Join with an invite's single-use code
      description: |
        Signs the device in, as the account its invite names: every client gets the same answer,
        its device, a one-hour bearer and a rotating refresh token, and never a password or device
        credential. A phone also gets `connection` (the route it paired through and its signed
        manifest). Agent claims are refused through remote access (403 `agent_remote`). An
        unknown, used, expired or cancelled code is 403 `invalid_pairing`.
      security: []
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PairedInviteClaim" } } } }
      responses:
        "200": { description: Joined and signed in, content: { application/json: { schema: { $ref: "#/components/schemas/PairedClaim" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/paired/devices:
    get:
      operationId: listPairedDevices
      tags: [Paired]
      summary: Paired devices the caller may see
      description: An administrator sees every paired device; a paired device sees itself and the companions it vouched for (a phone's Watch). Anyone else is refused.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: client, in: query, required: false, explode: true, schema: { type: array, items: { type: string, enum: [phone, watch, agent] } } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [active, revoked] } }
      responses:
        "200": { description: Devices, content: { application/json: { schema: { type: object, additionalProperties: false, required: [devices], properties: { devices: { type: array, items: { $ref: "#/components/schemas/PairedDevice" } } } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeRevokedPairedDevices
      tags: [Paired]
      summary: Remove every revoked device record
      description: Requires `?status=revoked`. Active devices are never touched. Sessions, invites and change history keep their rows with the device reference cleared.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ name: status, in: query, required: true, schema: { type: string, enum: [revoked] } }, { $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200": { description: Removed, content: { application/json: { schema: { type: object, additionalProperties: false, required: [removed], properties: { removed: { type: integer, minimum: 0 } } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/paired/devices/{id}:
    get:
      operationId: getPairedDevice
      tags: [Paired]
      summary: One paired device the caller may see
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Device, content: { application/json: { schema: { type: object, additionalProperties: false, required: [device], properties: { device: { $ref: "#/components/schemas/PairedDevice" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updatePairedDevice
      tags: [Paired]
      summary: Rename a paired device or change its scope
      description: Administrator only. The scope must stay a valid pair for the device's client (400 `invalid_scope`); in practice only an agent's scope changes, between `full` and `readOnly`.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/CsrfToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PairedDeviceUpdate" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { type: object, additionalProperties: false, required: [device], properties: { device: { $ref: "#/components/schemas/PairedDevice" } } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: revokePairedDevice
      tags: [Paired]
      summary: Revoke a paired device and its sessions, or remove its record
      description: |
        An administrator, the device itself, or the phone that vouched for it (its parent) may
        revoke it: its bearer and refresh token end, and it must pair again. Revoking or removing a
        phone revokes its Watches too. Only an administrator may use `?remove=true` to delete the
        record for good. Sessions, invites and change history keep their rows with the reference
        cleared.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: remove, in: query, required: false, schema: { type: string, enum: ["true"] } }
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "200": { description: Revoked, content: { application/json: { schema: { type: object, required: [ok], properties: { ok: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/upstream/resolver:
    get:
      operationId: getUpstreamResolver
      tags: [Upstream]
      summary: Household category-check resolver and schedule
      description: |
        Returned in full. A resolver URL is configuration rather than a credential — a
        profile id in its path lets someone spend that profile's quota, not read its
        logs or change a setting — and hiding it left a mistyped endpoint invisible
        behind an unknown verdict.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Resolver settings
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [resolver]
                properties:
                  resolver: { $ref: "#/components/schemas/UpstreamResolver" }
        "401":
          $ref: "#/components/responses/Error"
        "403": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateUpstreamResolver
      tags: [Upstream]
      summary: Set the endpoint or the sweep schedule
      description: |
        A DoH URL overrides DHCP-discovered DNS. Changing the URL invalidates affected
        verdicts. Disabling checking clears prior verdicts; manual checks remain available.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpstreamResolverUpdate" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [resolver]
                properties:
                  resolver: { $ref: "#/components/schemas/UpstreamResolver" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    delete:
      operationId: clearUpstreamResolver
      tags: [Upstream]
      summary: Remove the household DoH override
      description: |
        Returns the household to UniFi DHCP discovery without changing its check
        schedule. Affected verdicts are invalidated.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok]
                properties:
                  ok: { type: boolean }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/groups/{id}/resolver:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getGroupResolver
      tags: [Upstream]
      summary: Effective category-check resolver for a group
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Effective resolver and discovered networks
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [resolver]
                properties:
                  resolver: { $ref: "#/components/schemas/EffectiveResolver" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: setGroupResolver
      tags: [Upstream]
      summary: Point this group's upstream checks at its own endpoint
      description: |
        Reporting only, like the rest of Upstream. This changes which resolver FamilyFi
        asks about this group, so its category verdicts describe its own devices
        instead of the household's. It does not change what reaches those devices —
        pointing them at the resolver is a DHCP or client-side job.
        Changing the URL immediately clears this group's verdicts; saving the same
        URL preserves them. In-flight results from the replaced endpoint are discarded.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url]
              properties:
                url: { type: string, description: Absolute https URL. }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [group]
                properties:
                  group: { $ref: "#/components/schemas/Group" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: clearGroupResolver
      tags: [Upstream]
      summary: Return this group to the household resolver
      description: |
        Drops the group's own verdicts with the override. They describe an endpoint it
        no longer uses, and keeping them would leave a stale answer on its cards until
        the next sweep.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [group]
                properties:
                  group: { $ref: "#/components/schemas/Group" }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: familyfi_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        A paired device's one-hour access token, from its claim (POST /api/v1/paired/invites/{id}/claim,
        or a phone's ?claim=true for its Watch) or POST /api/v1/auth/refresh. Renew it with its refresh token before
        or after it expires; revoking the device ends both.
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for cookie-authenticated mutations. Must match familyfi_csrf.
      schema: { type: string }
    AccountId:
      name: id
      in: path
      required: true
      schema: { type: string }
    GroupId:
      name: id
      in: path
      required: true
      schema: { type: string }
    Mac:
      name: mac
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, db, version, update]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        db:
          type: string
          enum: [ok, error, unconfigured]
        version:
          type: string
          description: Application semver from package.json (no leading v).
        revision:
          type: integer
          minimum: 0
        error:
          type: string
          description: Present when status is degraded due to configuration, not secrets.
        update:
          $ref: "#/components/schemas/UpdateCheck"
    ImportSummary:
      type: object
      additionalProperties: false
      required: [exportedAt, appVersion, counts, gateway, unifiKey, endpointsNeedingToken, skippedEndpoints, otherInstallPolicies, databaseDump]
      properties:
        exportedAt: { type: string, format: date-time }
        appVersion: { type: string, description: "The FamilyFi version that wrote the export (no leading v)." }
        counts:
          type: object
          additionalProperties: false
          required: [groups, accounts, devices, rules, categories, endpoints]
          properties:
            groups: { type: integer }
            accounts: { type: integer }
            devices: { type: integer }
            rules: { type: integer }
            categories: { type: integer }
            endpoints: { type: integer }
        gateway:
          type: string
          enum: [imported, kept]
          description: "`kept` when a UniFi key is saved here for another console or site: this install's gateway connection stays."
        unifiKey:
          type: string
          enum: [kept, missing]
          description: "`missing` when no UniFi key is saved here; setup asks for it after the import."
        endpointsNeedingToken:
          type: array
          items: { type: string }
          description: Routes imported switched off, because their Cloudflare Access token is not saved here.
        skippedEndpoints:
          type: array
          items: { type: string }
          description: FamilyFi's own tunnel routes, which are not imported; turn remote access on again.
        otherInstallPolicies:
          type: boolean
          description: The export came from another install on this gateway; the FamilyFi policies that install made stay on it for the operator to delete in UniFi.
        databaseDump: { type: boolean, description: The export carries `database.dump`. }
    UpdateSchedule:
      type: object
      additionalProperties: false
      required: [enabled, days, time]
      properties:
        enabled: { type: boolean }
        days:
          type: array
          minItems: 1
          maxItems: 7
          items: { type: integer, minimum: 0, maximum: 6 }
          description: 0 is Sunday. At least one day, even while the schedule is off.
        time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Household-local HH:MM.
          example: "00:00"
    UpdateRun:
      type: object
      additionalProperties: false
      description: The latest install request, manual or scheduled. Only the latest is kept.
      required: [targetVersion, status, requestedAt, error]
      properties:
        targetVersion: { type: string, description: "Semver the update check offered (no leading v)." }
        status:
          type: string
          enum: [requested, succeeded, failed, skipped, unchanged]
          description: |
            `requested` until the outcome is known. `succeeded`: the new release is running. `failed`: Watchtower
            did not replace the container (the backup before installing failed, or the replacement did), could not
            be reached, or reported nothing within 30 minutes. `skipped`: Watchtower skipped it for a reason of its
            own. `unchanged`: no newer image under the tag FamilyFi runs, as when `FAMILYFI_IMAGE` pins a version.
        requestedAt: { type: string, format: date-time }
        error: { type: [string, "null"], description: "Why it did not succeed, for the operator." }
    UpdateSettings:
      type: object
      additionalProperties: false
      required: [updater, schedule, nextRunAt, lastRun]
      properties:
        updater:
          type: object
          additionalProperties: false
          required: [configured]
          properties:
            configured: { type: boolean, description: "The Watchtower sidecar answers to FamilyFi's token, so FamilyFi can install." }
        schedule: { $ref: "#/components/schemas/UpdateSchedule" }
        nextRunAt:
          type: [string, "null"]
          format: date-time
          description: The next scheduled install check; null when the schedule is off or the updater is not set up.
        lastRun:
          oneOf:
            - $ref: "#/components/schemas/UpdateRun"
            - type: "null"
    UpdateCheck:
      type: object
      additionalProperties: false
      required: [status, available, currentVersion, latestVersion, releaseUrl, releaseNotes, checkedAt, lastSuccessfulAt, error]
      description: Process-local GitHub release metadata. An error here does not degrade FamilyFi or database readiness.
      properties:
        status:
          type: string
          enum: [pending, ok, error]
        available:
          type: [boolean, "null"]
          description: True only when a newer applicable GitHub release is known; null while pending or after a failed check.
        currentVersion:
          type: string
          description: Application semver from package.json (no leading v).
        latestVersion:
          type: [string, "null"]
          description: Highest applicable published GitHub release semver (no leading v), if one exists.
        releaseUrl:
          type: [string, "null"]
          format: uri
          description: Canonical GitHub URL for latestVersion, if one exists.
        releaseNotes:
          type: [string, "null"]
          description: Markdown body of the latestVersion release as published on GitHub, capped at 20,000 characters; null when there is no release or it has no notes.
        checkedAt:
          type: [string, "null"]
          format: date-time
          description: Completion time for the latest check attempt.
        lastSuccessfulAt:
          type: [string, "null"]
          format: date-time
          description: Completion time for the latest successful GitHub response.
        error:
          type: [string, "null"]
          description: Safe operator-facing reason for a failed check; never a raw GitHub response body or credentials.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
        client:
          type: string
          enum: [browser]
          default: browser
    Session:
      type: object
      additionalProperties: false
      required: [username, displayName, kind, expiresAt]
      properties:
        username: { type: string }
        displayName: { type: string }
        kind:
          type: string
          enum: [recovery, personal]
        expiresAt:
          type: string
          format: date-time
    LoginResponse:
      type: object
      additionalProperties: false
      required: [session]
      properties:
        session:
          $ref: "#/components/schemas/Session"
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1 }
    RefreshResponse:
      type: object
      additionalProperties: false
      required: [session, token, tokenType, refreshToken, refreshExpiresAt]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        token: { type: string, description: The new one-hour bearer. }
        tokenType: { type: string, enum: [Bearer] }
        refreshToken: { type: string, description: The new refresh token. Store it; the one sent is spent. }
        refreshExpiresAt: { type: string, format: date-time }
    SessionResponse:
      type: object
      additionalProperties: false
      required: [session, timezone]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        timezone:
          type: string
          description: The household's IANA time zone, for clock times and window labels. A Watch reads it here because it may not read household settings.
          example: America/New_York
    Account:
      type: object
      additionalProperties: false
      required: [id, username, displayName, kind, isAdmin, groupId, recovery]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        kind: { type: string, enum: [recovery, personal] }
        isAdmin: { type: boolean }
        groupId: { type: [string, "null"] }
        recovery: { type: boolean }
    AccountCreate:
      type: object
      additionalProperties: false
      required: [username, displayName, password, groupId]
      properties:
        username: { type: string, minLength: 2 }
        displayName: { type: string }
        password: { type: string, minLength: 8 }
        groupId: { type: string }
        isAdmin: { type: boolean }
    AccountUpdate:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string }
        groupId: { type: string }
        isAdmin: { type: boolean }
    Household:
      type: object
      additionalProperties: false
      required: [displayName, timezone, revision, quarantineEnforced, quarantineObservedEnabled, quarantinePolicyCount]
      properties:
        displayName: { type: string }
        timezone: { type: string }
        revision: { type: integer, minimum: 0 }
        quarantineEnforced: { type: boolean }
        quarantineObservedEnabled:
          type: [boolean, "null"]
          description: Live UniFi enabled flag across app-owned quarantine policies. True if any is enabled.
        quarantinePolicyCount: { type: integer, minimum: 0 }
    ConnectionIdentity:
      type: object
      additionalProperties: false
      required: [protocolVersion, householdName, instanceId, publicKey, keyFingerprint]
      properties:
        protocolVersion: { type: integer, const: 1 }
        householdName: { type: string }
        instanceId: { type: string }
        publicKey: { $ref: "#/components/schemas/ConnectionSigningKey" }
        keyFingerprint: { type: string }
    ConnectionSigningKey:
      type: object
      additionalProperties: false
      required: [kty, crv, x]
      properties:
        kty: { type: string, const: OKP }
        crv: { type: string, const: Ed25519 }
        x: { type: string, description: Base64url encoded Ed25519 public key. }
    ConnectionEndpoint:
      type: object
      additionalProperties: false
      required: [id, url, kind, transport, trustMode, spkiSha256, priority, enabled, edgeAuth, edgeTokenVersion]
      properties:
        id: { type: string }
        url: { type: string, format: uri }
        edgeAuth: { type: string, enum: [none, serviceToken], description: "Whether Cloudflare Access guards the route. The token itself is never served here: phones get it in the pairing code and their signed manifest." }
        edgeTokenVersion: { type: [integer, "null"], minimum: 1, description: "The current Access token's version, rising each time it is replaced; null without Access." }
        kind:
          type: string
          enum: [quick, domain, own]
          description: "Who runs the route: FamilyFi's quick tunnel, FamilyFi's tunnel on the household's domain, or the household."
        transport: { type: string, enum: [lan, tailscale, cloudflare] }
        trustMode: { type: string, enum: [system, pinned] }
        spkiSha256: { type: [string, "null"] }
        priority: { type: integer, minimum: 0 }
        enabled: { type: boolean }
    ConnectionEndpointWrite:
      type: object
      additionalProperties: false
      required: [url, transport, trustMode]
      properties:
        url: { type: string, format: uri }
        transport: { type: string, enum: [lan, tailscale, cloudflare] }
        trustMode: { type: string, enum: [system, pinned] }
        spkiSha256: { type: string }
        priority: { type: integer, minimum: 0 }
        enabled: { type: boolean }
        edgeAuth: { type: string, enum: [none, serviceToken], description: "`none` turns Cloudflare Access off for the route." }
        serviceToken:
          type: object
          writeOnly: true
          additionalProperties: false
          required: [clientId, clientSecret]
          description: A Cloudflare Access service token for a `cloudflare` route. Stored encrypted; never returned.
          properties:
            clientId: { type: string, minLength: 1, maxLength: 512 }
            clientSecret: { type: string, minLength: 1, maxLength: 512 }
    ConnectionEndpointUpdate:
      type: object
      additionalProperties: false
      description: "Partial update. Moving a pinned route to `system` trust must also send `spkiSha256: null`."
      properties:
        url: { type: string, format: uri }
        transport: { type: string, enum: [lan, tailscale, cloudflare] }
        trustMode: { type: string, enum: [system, pinned] }
        spkiSha256: { type: [string, "null"] }
        priority: { type: integer, minimum: 0, maximum: 999 }
        enabled: { type: boolean }
        edgeAuth: { type: string, enum: [none, serviceToken], description: "`none` turns Cloudflare Access off for the route." }
        serviceToken:
          type: object
          writeOnly: true
          additionalProperties: false
          required: [clientId, clientSecret]
          description: A Cloudflare Access service token for a `cloudflare` route. Stored encrypted; never returned.
          properties:
            clientId: { type: string, minLength: 1, maxLength: 512 }
            clientSecret: { type: string, minLength: 1, maxLength: 512 }
    RemoteAccess:
      type: object
      additionalProperties: false
      required: [mode, status, url, error, endpointId, cloudflared, hostname, loginUrl]
      properties:
        mode: { type: string, enum: ["off", quick, named], description: "`named` is my domain: FamilyFi's tunnel on it, or an `own` route." }
        status: { type: string, enum: ["off", signing-in, starting, running, error, unavailable] }
        url: { type: [string, "null"], format: uri, description: "Where phones reach home: the tunnel's current public address, or an `own` route's address." }
        error: { type: [string, "null"] }
        endpointId: { type: [string, "null"], description: "The route remote access publishes — the only one enabled. Null while off, or before a tunnel's first route exists." }
        cloudflared: { type: [string, "null"], description: "cloudflared version on this server, or null when it is not installed." }
        hostname: { type: [string, "null"], description: "The hostname of the `domain` route, when one is set up — even while another route is published." }
        loginUrl: { type: [string, "null"], format: uri, description: "While status is signing-in, the Cloudflare link a person opens to authorize FamilyFi." }
    ConnectionCertificatePin:
      type: object
      additionalProperties: false
      required: [spkiSha256, subject, issuer, validTo, systemTrusted, source]
      properties:
        spkiSha256: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        subject: { type: string }
        issuer: { type: string }
        validTo: { type: string, format: date-time }
        systemTrusted: { type: [boolean, "null"], description: "Whether FamilyFi's CA store trusts the chain for this host; null for a pasted certificate. True means a pin is unnecessary." }
        source: { type: string, enum: [probe, certificate] }
    DeviceScope:
      type: string
      enum: [full, rulesOnly, readOnly]
      description: |
        What a paired device may call. Each (client, scope) pair is one explicit allowlist, not a
        ladder, and only four exist. `phone:full` may do whatever its account may. `watch:rulesOnly`
        reads its session, connection manifest, groups, rules and changes, and pauses, resumes,
        extends, allows, disallows and turns rules on and off (403 `watch_scope` beyond that).
        `agent:readOnly` reads household state: groups, rules, devices, sync, changes, DNS categories
        and household settings (its timezone). `agent:full` also changes groups, rules and their
        verbs, devices and their assignment, sync and DNS categories. No agent reaches accounts,
        UniFi settings or resolvers, changes household settings, or manages connections or paired
        devices; it may only revoke itself. Beyond its scope an agent gets 403 `agent_scope`, and over remote access
        403 `agent_remote`.
    PairedInviteCreate:
      type: object
      additionalProperties: false
      description: |
        An administrator's invite. A phone needs the route it pairs over (`endpointId`) and may name
        the administrator it signs in as (`accountId`, default: whoever makes it), and
        `replacesDeviceId` to re-pair a phone. An agent needs a `scope` of `full` or `readOnly`.
      required: [client, displayName]
      properties:
        client: { type: string, enum: [phone, agent] }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        endpointId: { type: string }
        accountId: { type: string }
        replacesDeviceId: { type: string, description: "Re-pair: when this invite is claimed, the phone with this id is revoked and its record removed, so it is not listed twice. 404 if it no longer exists." }
        scope: { type: string, enum: [full, readOnly], description: "An agent's DeviceScope; agents hold only these two." }
    PairedWatchCreate:
      type: object
      additionalProperties: false
      description: A phone's Watch, invited and claimed at once with `?claim=true`.
      required: [client, clientId]
      properties:
        client: { type: string, enum: [watch] }
        clientId: { type: string, format: uuid }
        displayName: { type: string, minLength: 1, maxLength: 80 }
    HomeAddressResponse:
      type: object
      additionalProperties: false
      required: [home]
      properties:
        home:
          type: object
          additionalProperties: false
          required: [url, current]
          properties:
            url: { type: [string, "null"], format: uri, description: "The saved home network origin, or null when none is set." }
            current:
              type: object
              additionalProperties: false
              required: [url, private]
              description: The address this request reached FamilyFi at, which Home access suggests when nothing is saved and it is private.
              properties:
                url: { type: string, format: uri }
                private:
                  type: boolean
                  description: |
                    True for a private, loopback, link-local or carrier-grade NAT IP, `localhost`, or a `.local` or
                    `.home.arpa` name. A public name may sit behind a proxy's sign-in page, which an agent cannot get past.
    PairedInviteIssued:
      type: object
      additionalProperties: false
      required: [invite]
      properties:
        invite:
          type: object
          additionalProperties: false
          required: [id, expiresAt, code]
          properties:
            id: { type: string }
            expiresAt: { type: string, format: date-time }
            url:
              type: string
              format: uri
              description: Only for an agent, the address its code carries, for the prompt that points it at `/agents.md`.
            code:
              type: string
              pattern: "^[A-Za-z0-9_-]+$"
              description: |
                The single string a phone scans as a QR or pastes, or an agent is given in its prompt:
                base64url, without padding, of UTF-8 JSON. Version 1 is
                `{"version":1,"url","code","fingerprint"}` plus at most one of `pin` and `access`:

                - `url`: the origin to join over (a phone's published HTTPS route; for an agent, the
                  household's home network address, or the address the invite was made at when there
                  is none).
                - `code`: the single-use claim, `inviteId.token`; the token after the first `.` is
                  what `POST /paired/invites/{id}/claim` takes.
                - `fingerprint`: the household key fingerprint, which must equal
                  `GET /connection/identity`'s `keyFingerprint`.
                - `pin`: only on a phone's pinned LAN route, the SHA-256 SPKI pin.
                - `access`: only on a phone's route behind Cloudflare Access, the service token
                  (`clientId`, `clientSecret`) that gets it past Access to join. Never for an agent.
    PairedInviteStatus:
      type: object
      additionalProperties: false
      required: [id, status, expiresAt, device]
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, claimed, expired], description: A cancelled invite reads as expired. }
        expiresAt: { type: string, format: date-time }
        device:
          type: [object, "null"]
          additionalProperties: false
          required: [id, displayName]
          properties:
            id: { type: string }
            displayName: { type: string }
    PairedInviteClaim:
      type: object
      additionalProperties: false
      required: [token, deviceName]
      properties:
        token: { type: string }
        deviceName: { type: string, minLength: 1, maxLength: 80 }
    PairedClaim:
      type: object
      additionalProperties: false
      description: |
        What every claim answers, signed in as the account the invite named. `connection` is only
        for clients that may work away from home — phones and Watches: the route a phone paired
        through, and the signed manifest (with Cloudflare Access `edgeCredentials`). Never for agents.
      required: [device, session, token, tokenType, refreshToken, refreshExpiresAt]
      properties:
        device:
          type: object
          additionalProperties: false
          required: [id, displayName, client, scope]
          properties:
            id: { type: string }
            displayName: { type: string }
            client: { type: string, enum: [phone, watch, agent] }
            scope: { $ref: "#/components/schemas/DeviceScope" }
        session: { $ref: "#/components/schemas/Session" }
        token: { type: string, description: The one-hour bearer. }
        tokenType: { type: string, enum: [Bearer] }
        refreshToken: { type: string, description: "Renews the bearer at POST /api/v1/auth/refresh; it rotates on every use." }
        refreshExpiresAt: { type: string, format: date-time }
        connection:
          type: object
          additionalProperties: false
          required: [manifest]
          properties:
            endpoint: { $ref: "#/components/schemas/ConnectionEndpoint" }
            manifest: { $ref: "#/components/schemas/ConnectionEndpointManifest" }
    PairedWatchClaimed:
      type: object
      additionalProperties: false
      description: "`?claim=true`: the Watch's invite, already claimed, with the same claim every client gets."
      required: [invite, device, session, token, tokenType, refreshToken, refreshExpiresAt, connection]
      properties:
        invite:
          type: object
          additionalProperties: false
          required: [id, expiresAt, status]
          properties:
            id: { type: string }
            expiresAt: { type: string, format: date-time }
            status: { type: string, enum: [claimed] }
        device: { $ref: "#/components/schemas/PairedClaim/properties/device" }
        session: { $ref: "#/components/schemas/Session" }
        token: { type: string, description: The Watch's one-hour bearer. }
        tokenType: { type: string, enum: [Bearer] }
        refreshToken: { type: string, description: "Renews the Watch's bearer at POST /api/v1/auth/refresh; it rotates on every use." }
        refreshExpiresAt: { type: string, format: date-time }
        connection: { $ref: "#/components/schemas/PairedClaim/properties/connection" }
    ConnectionEndpointManifest:
      type: object
      additionalProperties: false
      required: [instanceId, endpoints, signedPayload, signature]
      properties:
        instanceId: { type: string }
        endpoints: { type: array, items: { $ref: "#/components/schemas/ConnectionEndpoint" } }
        signedPayload:
          type: string
          description: |
            Base64url canonical manifest bytes covered by signature. The JSON holds `instanceId` and
            `endpoints`, the same route shape as `endpoints` here. For a
            paired device's session, and in the claim response, it also holds `edgeCredentials`:
            `[{ endpointId, version, clientId, clientSecret }]`, one per enabled route behind
            Cloudflare Access. Send `CF-Access-Client-Id` and `CF-Access-Client-Secret` to that route
            only. A browser session never receives `edgeCredentials`.
        signature: { type: string, description: Base64url Ed25519 signature over signedPayload bytes. }
    PairedDevice:
      type: object
      additionalProperties: false
      required: [id, displayName, client, scope, actsAs, parentDeviceId, enrolledAt, lastSeenAt, revokedAt, pairedVia, edgeTokens, sessions]
      properties:
        id: { type: string }
        displayName: { type: string }
        client: { type: string, enum: [phone, watch, agent] }
        scope: { $ref: "#/components/schemas/DeviceScope" }
        actsAs:
          type: [object, "null"]
          description: The account this device acts as, named by its invite.
          additionalProperties: false
          required: [username, displayName]
          properties:
            username: { type: string }
            displayName: { type: string }
        parentDeviceId: { type: [string, "null"], description: "The device that vouched for this one: a Watch's phone." }
        enrolledAt: { type: string, format: date-time }
        lastSeenAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
        pairedVia:
          type: [object, "null"]
          description: The route this device paired through; null for Watches and agents, or if that route is deleted.
          additionalProperties: false
          required: [endpointId, url, transport]
          properties:
            endpointId: { type: string }
            url: { type: string, format: uri }
            transport: { type: string, enum: [lan, tailscale, cloudflare] }
        edgeTokens:
          type: array
          description: "The Cloudflare Access token version FamilyFi last handed this device, per protected route. Compare with the route's `edgeTokenVersion` to see who still holds an old token."
          items:
            type: object
            additionalProperties: false
            required: [endpointId, version]
            properties:
              endpointId: { type: string }
              version: { type: integer, minimum: 1 }
        sessions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, username, client, expiresAt, createdAt]
            properties:
              id: { type: string }
              username: { type: string }
              client: { type: string, enum: [phone, watch, agent] }
              expiresAt: { type: string, format: date-time, description: "When this sign-in ends unless renewed: the refresh token's expiry." }
              createdAt: { type: string, format: date-time }
    PairedDeviceUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        scope: { $ref: "#/components/schemas/DeviceScope" }
    ConnectionStatus:
      type: object
      additionalProperties: false
      required: [endpoints, endpointManifest, unifi, lastChange]
      properties:
        endpoints: { type: array, items: { $ref: "#/components/schemas/ConnectionEndpoint" } }
        endpointManifest: { $ref: "#/components/schemas/ConnectionEndpointManifest" }
        unifi: { $ref: "#/components/schemas/ConnectionUnifiStatus" }
        lastChange:
          type: [object, "null"]
          additionalProperties: false
          required: [id, scope, status, error, updatedAt]
          properties:
            id: { type: string }
            scope: { type: string }
            status: { type: string }
            error: { type: [string, "null"] }
            updatedAt: { type: string, format: date-time }
    ConnectionUnifiStatus:
      type: object
      additionalProperties: false
      required: [status, error, lastSyncAt]
      properties:
        status: { type: string }
        error: { type: [string, "null"] }
        lastSyncAt: { type: [string, "null"], format: date-time }
    UnifiSettings:
      type: object
      additionalProperties: false
      required: [configured, mode, baseUrl, consoleId, siteId, apiKeyMasked, tlsInsecure, manageAllNetworks, managedNetworkIds, networks, connectionStatus, connectionError]
      properties:
        configured: { type: boolean }
        mode: { type: [string, "null"] }
        baseUrl: { type: [string, "null"] }
        consoleId: { type: [string, "null"] }
        siteId: { type: [string, "null"] }
        apiKeyMasked: { type: [string, "null"] }
        tlsInsecure: { type: boolean }
        manageAllNetworks: { type: boolean }
        managedNetworkIds:
          type: array
          items: { type: string }
        networks:
          type: array
          items: { $ref: "#/components/schemas/UnifiNetwork" }
        connectionStatus: { type: string }
        connectionError: { type: [string, "null"] }
    UnifiNetwork:
      type: object
      additionalProperties: false
      required: [id, name, vlanId, zoneId]
      properties:
        id: { type: string }
        name: { type: string }
        vlanId: { type: integer }
        zoneId: { type: [string, "null"] }
    UnifiProbeRequest:
      type: object
      additionalProperties: false
      properties:
        apiKey: { type: string, minLength: 8 }
        baseUrl: { type: string }
        consoleId: { type: string }
        siteId: { type: string }
        tlsInsecure: { type: boolean }
    UnifiSettingsWrite:
      type: object
      additionalProperties: false
      properties:
        apiKey: { type: string, minLength: 8 }
        baseUrl: { type: string }
        consoleId: { type: string }
        siteId: { type: string }
        tlsInsecure: { type: boolean }
        manageAllNetworks: { type: boolean }
        managedNetworkIds:
          type: array
          items: { type: string }

    DpiCatalogItem:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    CuratedCategoryCandidate:
      type: object
      additionalProperties: false
      required: [slot, label, categoryId, catalogName]
      properties:
        slot: { type: string, enum: [video, social, gaming, vpn, messaging] }
        label: { type: string }
        categoryId: { type: integer }
        catalogName: { type: string }
    CuratedCategoryMap:
      type: object
      additionalProperties: false
      required: [status, candidates]
      description: |
        Confirmed curated slots — Video (4), Social (24), Gaming (8), VPN (11),
        Messaging (0). No Porn curated slot. Messaging's id is zero, so clients
        must not treat a category id as falsy.
      properties:
        status: { type: string, enum: [provisional, confirmed] }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/CuratedCategoryCandidate" }
    RuleWindow:
      type: object
      additionalProperties: false
      required: [id, name, days, start, end]
      description: |
        One recurring window, and one UniFi policy. `days` are the days it starts on
        (0 = Sunday); a window may cross midnight, so 22:00–06:00 on Friday ends Saturday.
      properties:
        id: { type: string }
        name: { type: string, maxLength: 30, description: "Empty means \"Window n\" in policy names." }
        days:
          type: array
          minItems: 1
          items: { type: integer, minimum: 0, maximum: 6 }
        start: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        end: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
    RuleWindowInput:
      type: object
      additionalProperties: false
      required: [days, start, end]
      properties:
        id: { type: string, description: "A stored window's id, to keep its UniFi policy. Omit for a new window." }
        name: { type: string, maxLength: 30 }
        days:
          type: array
          minItems: 1
          items: { type: integer, minimum: 0, maximum: 6 }
        start: { type: string }
        end: { type: string }
    RuleKind:
      type: string
      enum: [internet, category, app, domain]
      description: |
        internet = all internet on every covered device; category / app = UniFi DPI ids in
        `targetIds`; domain = the websites in `domains` and their subdomains, matched by
        the gateway from DNS lookups (encrypted DNS can get around it).
    Rule:
      type: object
      additionalProperties: false
      required: [id, name, kind, scope, groupIds, networkIds, targetIds, domains, enabled, pause, groupPauses, mode, windows, useGeneratedName, policyNames, builtIn]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 60 }
        kind: { $ref: "#/components/schemas/RuleKind" }
        scope:
          type: string
          enum: [group, network]
          description: group = the covered groups' devices by MAC; network = Settings-managed NETWORK source
        groupIds:
          type: array
          items: { type: string }
          description: The groups the rule covers when scope=group; empty for network scope
        networkIds:
          type: array
          items: { type: string, format: uuid }
          description: Managed UniFi network ids when scope=network; empty for group scope
        targetIds:
          type: array
          items: { type: integer }
          maxItems: 100
          description: DPI ids for category and app rules; empty otherwise
        domains:
          type: array
          items: { type: string }
          maxItems: 100
          description: Website domains for domain rules; empty otherwise
        enabled: { type: boolean }
        pause: { $ref: "#/components/schemas/RulePause" }
        groupPauses:
          type: array
          description: The same lift for one group alone; only the active ones.
          items:
            type: object
            additionalProperties: false
            required: [groupId, pause]
            properties:
              groupId: { type: string }
              pause: { $ref: "#/components/schemas/RulePause" }
        mode:
          type: string
          enum: [always, scheduled]
          description: always = one policy with no schedule; scheduled = one policy per window. An internet rule is always group-scoped, never a whole network.
        windows:
          type: array
          items: { $ref: "#/components/schemas/RuleWindow" }
          description: Empty when mode=always
        useGeneratedName: { type: boolean, description: "Name its UniFi policies \"FamilyFi Rule <id>\" instead of after the rule." }
        builtIn:
          type: [string, "null"]
          enum: [quarantine, null]
          description: |
            Set on a rule FamilyFi provides; null on the household's own. `quarantine` (id
            `quarantine`) blocks all internet for unassigned devices on managed networks. It covers
            no group (`groupIds` empty), cannot be edited or deleted (409 `rule_built_in`), and is
            paused, extended and resumed like any rule, never allowed. Its `enabled` is the
            household's `quarantineEnforced`; its policies are the quarantine policies.
        policyNames:
          type: array
          items: { type: string, maxLength: 100 }
          description: |
            What UniFi's policy table shows for the rule in the Internal zone, one per
            policy: "FamilyFi " and the rule name, then " – " and the window name when it
            has more than one window. Another zone's policy adds " (<zone>)".
    RuleCreate:
      type: object
      additionalProperties: false
      required: [name, kind, mode]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        kind: { $ref: "#/components/schemas/RuleKind" }
        scope:
          type: string
          enum: [group, network]
          default: group
          description: Omit or group for member scope; network requires managed networkIds (D9) and is not allowed for internet rules
        groupIds:
          type: array
          items: { type: string }
          minItems: 1
          description: Required when scope is group (default)
        networkIds:
          type: array
          items: { type: string, format: uuid }
          minItems: 1
          description: Required when scope=network; must be Settings-managed (or any site network when manage-all)
        targetIds:
          type: array
          items: { type: integer, minimum: 0 }
          minItems: 1
          maxItems: 100
          description: Required for category and app rules
        domains:
          type: array
          items: { type: string }
          minItems: 1
          maxItems: 100
          description: Required for domain rules. A pasted URL is reduced to its host.
        enabled: { type: boolean, default: true }
        mode: { type: string, enum: [always, scheduled] }
        windows:
          type: array
          items: { $ref: "#/components/schemas/RuleWindowInput" }
          minItems: 1
          maxItems: 12
          description: Required when mode=scheduled
        useGeneratedName: { type: boolean, default: false }
    RuleUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        groupIds:
          type: array
          items: { type: string }
          minItems: 1
        networkIds:
          type: array
          items: { type: string, format: uuid }
          minItems: 1
          description: Only valid for network-scoped rules; managed ids only
        targetIds:
          type: array
          items: { type: integer, minimum: 0 }
          minItems: 1
          maxItems: 100
        domains:
          type: array
          items: { type: string }
          minItems: 1
          maxItems: 100
        enabled: { type: boolean }
        mode: { type: string, enum: [always, scheduled] }
        windows:
          type: array
          items: { $ref: "#/components/schemas/RuleWindowInput" }
          maxItems: 12
        useGeneratedName: { type: boolean }
    Actor:
      type: [object, "null"]
      additionalProperties: false
      required: [accountId, name]
      description: Who made the change, when known.
      properties:
        accountId: { type: [string, "null"] }
        name: { type: string }
    RulePause:
      type: object
      additionalProperties: false
      required: [active, until, kind, by]
      description: |
        A pause suspends a rule and an allowance overrides it; either lifts the rule until
        `until`, or until ended when null. On a rule it covers every group; in `groupPauses`
        it covers one group. Never set through create or update.
      properties:
        active: { type: boolean }
        until: { type: [string, "null"], format: date-time }
        kind: { type: string, enum: [pause, allow] }
        by: { $ref: "#/components/schemas/Actor" }
    Suspension:
      type: object
      additionalProperties: false
      required: [active, until, by]
      description: Read-only, derived from the group's built-in `internet` rule. A pause blocks all internet for the group until `until`, or until resumed when null.
      properties:
        active: { type: boolean }
        until: { type: [string, "null"], format: date-time }
        by: { $ref: "#/components/schemas/Actor" }
    Allowance:
      type: object
      additionalProperties: false
      required: [active, until, by]
      description: Read-only, derived from the group's internet rules. An allowance is an allowance lift on any enabled internet rule of the group while no other internet rule is blocking it, until the earliest end, or until disallowed when null.
      properties:
        active: { type: boolean }
        until: { type: [string, "null"], format: date-time }
        by: { $ref: "#/components/schemas/Actor" }
    Group:
      type: object
      additionalProperties: false
      required: [id, kind, name, monogram, familyRole, deviceCount, suspension, allowance, internetRuleIds, access, dohOverrideUrl]
      properties:
        id: { type: string }
        kind: { type: string, enum: [family, things] }
        name: { type: string }
        monogram: { type: [string, "null"] }
        familyRole: { type: [string, "null"], enum: [child, teen, adult, null] }
        deviceCount: { type: integer, minimum: 0 }
        suspension: { $ref: "#/components/schemas/Suspension" }
        allowance: { $ref: "#/components/schemas/Allowance" }
        internetRuleIds:
          type: array
          items: { type: string }
          description: The group's internet rules. Empty means nothing limits its internet.
        access:
          type: string
          enum: [available, blocked, paused, allowed]
          description: |
            paused = a pause blocks all internet; blocked = an internet rule's window is
            active; allowed = an allowance is in effect, lifting any internet window until
            it ends (whether or not a window is active now); available otherwise.
        dohOverrideUrl:
          type: [string, "null"]
          description: |
            This group's own DoH endpoint, or null to read the household default. A card
            uses it to resolve its own upstream verdict rather than the household's.
    GroupCreate:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind: { type: string, enum: [family, things] }
        name: { type: string }
        monogram: { type: string, maxLength: 4 }
        familyRole: { type: string, enum: [child, teen, adult] }
    GroupUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        monogram: { type: [string, "null"] }
        familyRole: { type: [string, "null"], enum: [child, teen, adult, null] }
    Device:
      type: object
      additionalProperties: false
      required: [mac, manufacturer, hostname, ip, networkId, zoneId, groupId, assignment, lastSeenAt, presence, presenceCheckedAt, connectedAt, connectionType, accessPointName, unresolved, inScope]
      properties:
        mac: { type: string }
        manufacturer:
          type: [string, "null"]
          description: IEEE MAC address registrant, when the address has a public assignment. Locally administered addresses have no registrant here.
        hostname: { type: [string, "null"] }
        ip: { type: [string, "null"] }
        networkId: { type: [string, "null"] }
        zoneId: { type: [string, "null"] }
        groupId: { type: [string, "null"] }
        assignment: { type: string, enum: [assigned, quarantined] }
        lastSeenAt: { type: [string, "null"], format: date-time }
        presence:
          type: string
          enum: [online, offline, stale_online, stale_offline, unknown]
          description: Last connected-client observation. A result over 90 seconds old is stale, and unknown means there has been no successful check.
        presenceCheckedAt: { type: [string, "null"], format: date-time }
        connectedAt:
          type: [string, "null"]
          format: date-time
          description: UniFi-reported start of the current connection; null when offline or unavailable.
        connectionType: { type: [string, "null"], enum: [wired, wireless, vpn, teleport, null] }
        accessPointName:
          type: [string, "null"]
          description: Name of the wireless uplink access point, when UniFi can resolve it.
        unresolved: { type: boolean }
        inScope: { type: boolean }
    ChangeSummary:
      type: object
      additionalProperties: false
      description: Tracking handle returned when a mutation queues reconciliation. Poll the changeId at GET /api/v1/changes/{id} for its status.
      required: [changeId, revision]
      properties:
        changeId: { type: string }
        revision: { type: integer }
    Change:
      type: object
      additionalProperties: false
      required: [id, revision, appliedRevision, status, scope, deviceMac, actorAccountId, actorDeviceId, error, updatedAt]
      properties:
        id: { type: string }
        revision: { type: integer }
        appliedRevision: { type: [integer, "null"] }
        status: { type: string, enum: [pending, applied, partial, failed, superseded] }
        scope: { type: string }
        deviceMac: { type: [string, "null"] }
        actorAccountId: { type: [string, "null"] }
        actorDeviceId: { type: [string, "null"] }
        error: { type: [string, "null"] }
        updatedAt: { type: string, format: date-time }
    SyncStatus:
      type: object
      additionalProperties: false
      required: [revision, connectionStatus, appPolicyCount, failingCount, issues, lastRun, changes]
      properties:
        revision: { type: integer }
        connectionStatus: { type: string }
        appPolicyCount: { type: integer }
        failingCount: { type: integer }
        issues:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [groupId, groupName, kind, message]
            properties:
              groupId: { type: string }
              groupName: { type: string }
              kind: { type: string, enum: [no_members, unresolved_zone, missing_policy] }
              message: { type: string }
        lastRun:
          type: [object, "null"]
          additionalProperties: false
          required: [id, status, requestedRevision, appliedRevision, startedAt, finishedAt, error]
          properties:
            id: { type: string }
            status: { type: string }
            requestedRevision: { type: integer }
            appliedRevision: { type: [integer, "null"] }
            startedAt: { type: string, format: date-time }
            finishedAt: { type: [string, "null"], format: date-time }
            error: { type: [string, "null"] }
        changes:
          type: array
          items: { $ref: "#/components/schemas/Change" }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    UpstreamDomain:
      type: object
      additionalProperties: false
      required: [id, domain, source, removed]
      properties:
        id: { type: string }
        domain: { type: string }
        source: { type: string, enum: [seed, user] }
        removed:
          type: boolean
          description: A seeded domain the household removed. Shown struck through and restorable.
    UpstreamDomainResult:
      type: object
      additionalProperties: false
      required: [domain, blocked]
      properties:
        domain: { type: string }
        blocked:
          type: [boolean, "null"]
          description: Null means this domain could not be resolved — unknown, never "not blocked".
    UpstreamCheck:
      type: object
      additionalProperties: false
      required: [verdict, blockedCount, totalCount, checkedAt, error, groupId, results, source, networks]
      properties:
        verdict:
          type: string
          enum: [blocked, partial, open, unknown]
          description: unknown means the resolver could not be reached, never that nothing is blocked.
        blockedCount: { type: integer }
        totalCount: { type: integer }
        checkedAt: { type: string, format: date-time }
        error: { type: [string, "null"] }
        groupId:
          type: [string, "null"]
          description: The group this was measured for. Null is the household aggregate.
        results:
          type: array
          description: One entry per domain probed in this sweep. A domain removed since is absent.
          items: { $ref: "#/components/schemas/UpstreamDomainResult" }
        source: { type: string, enum: [doh, dhcp, unknown] }
        networks:
          type: array
          items: { $ref: "#/components/schemas/UpstreamNetworkCheck" }
    UpstreamCategory:
      type: object
      additionalProperties: false
      required: [id, slug, label, monogram, source, enabled, domains, activeDomainCount, costNote, checks]
      properties:
        id: { type: string }
        slug: { type: string }
        label: { type: string }
        monogram: { type: string, maxLength: 4 }
        source: { type: string, enum: [seed, user] }
        enabled:
          type: boolean
          description: Turns checking on or off only. It never blocks or unblocks anything.
        domains:
          type: array
          items: { $ref: "#/components/schemas/UpstreamDomain" }
        activeDomainCount: { type: integer }
        costNote: { type: string }
        checks:
          type: array
          description: |
            Every verdict measured for this category. DHCP discovery creates a row
            per group so a card can report for its assigned device networks; a DoH
            group override also uses its own row.
          items: { $ref: "#/components/schemas/UpstreamCheck" }
    UpstreamCategoryCreate:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label: { type: string, minLength: 1, maxLength: 60 }
        monogram: { type: string, minLength: 1, maxLength: 4 }
        domains:
          type: array
          items: { type: string }
        enabled: { type: boolean }
    UpstreamCategoryUpdate:
      type: object
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 60 }
        monogram: { type: string, minLength: 1, maxLength: 4 }
        enabled: { type: boolean }
        domains:
          type: array
          description: The whole active list, replacing what is stored.
          items: { type: string }
    UpstreamCheckRow:
      type: object
      additionalProperties: false
      required: [categoryId, slug, label, verdict, blockedCount, totalCount, checkedAt, error, groupId, results, source, networks]
      properties:
        categoryId: { type: string }
        slug: { type: string }
        label: { type: string }
        verdict: { type: string, enum: [blocked, partial, open, unknown] }
        blockedCount: { type: integer }
        totalCount: { type: integer }
        checkedAt: { type: string, format: date-time }
        error: { type: [string, "null"] }
        groupId:
          type: [string, "null"]
          description: The group this was measured for. Null is the household aggregate.
        results:
          type: array
          description: One entry per domain probed in this sweep. A domain removed since is absent.
          items: { $ref: "#/components/schemas/UpstreamDomainResult" }
        source: { type: string, enum: [doh, dhcp, unknown] }
        networks:
          type: array
          items: { $ref: "#/components/schemas/UpstreamNetworkCheck" }
    UpstreamNetworkCheck:
      type: object
      additionalProperties: false
      required: [id, name, verdict, error, servers]
      properties:
        id: { type: string }
        name: { type: string }
        verdict: { type: string, enum: [blocked, partial, open, unknown] }
        error: { type: [string, "null"] }
        servers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [address, verdict, error]
            properties:
              address: { type: string }
              verdict: { type: string, enum: [blocked, partial, open, unknown] }
              error: { type: [string, "null"] }
    DiscoveredResolverNetwork:
      type: object
      additionalProperties: false
      required: [id, name, servers, reason]
      properties:
        id: { type: string }
        name: { type: string }
        servers: { type: array, items: { type: string } }
        reason: { type: [string, "null"] }
    EffectiveResolver:
      type: object
      additionalProperties: false
      required: [configured, source, url, networks, reason]
      properties:
        configured: { type: boolean, description: An effective resolver was discovered or a DoH override is set. }
        source: { type: string, enum: [doh, dhcp, unknown] }
        url: { type: [string, "null"] }
        networks:
          type: array
          items: { $ref: "#/components/schemas/DiscoveredResolverNetwork" }
        reason: { type: [string, "null"] }
    UpstreamProbeOutcome:
      type: object
      additionalProperties: false
      required: [categoryId, slug, verdict, blockedCount, totalCount]
      properties:
        categoryId: { type: string }
        slug: { type: string }
        verdict: { type: string, enum: [blocked, partial, open, unknown] }
        blockedCount: { type: integer }
        totalCount: { type: integer }
    UpstreamResolver:
      type: object
      additionalProperties: false
      required: [configured, source, networks, reason, url, probeEnabled, probeTime, probeDays, timeoutMs, lastRunAt, nextRunAt]
      properties:
        configured: { type: boolean }
        source: { type: string, enum: [doh, dhcp, unknown] }
        networks:
          type: array
          items: { $ref: "#/components/schemas/DiscoveredResolverNetwork" }
        reason: { type: [string, "null"] }
        url:
          type: [string, "null"]
          description: The endpoint in full, e.g. https://dns.example.com/dns-query/profile
        probeEnabled: { type: boolean }
        probeTime: { type: string, description: "Household-local HH:MM, 24-hour." }
        probeDays:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
          description: 0 (Sunday) through 6 (Saturday). Empty means checking never runs.
        timeoutMs: { type: integer }
        lastRunAt:
          type: [string, "null"]
          format: date-time
          description: The most recent completed sweep, or null if none yet.
        nextRunAt:
          type: [string, "null"]
          format: date-time
          description: The next scheduled sweep, or null when checking is off or no days are selected.
    UpstreamResolverUpdate:
      type: object
      additionalProperties: false
      properties:
        url: { type: string, description: Absolute https URL. }
        probeEnabled: { type: boolean }
        probeTime: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: "Household-local HH:MM, 24-hour." }
        probeDays:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
        timeoutMs: { type: integer, minimum: 500, maximum: 30000 }
