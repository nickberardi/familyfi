openapi: 3.1.0
info:
  title: FamilyFi API
  version: 0.5.0
  description: |
    Versioned HTTP API used by the FamilyFi web/PWA and reserved for a future
    native client. Application state is desired configuration; UniFi is
    enforcement only. Signed-in operators can browse this specification under
    System → API (`/reference`). Groups, devices, accounts, UniFi settings, and
    sync are specified here.
  license:
    name: Business Source License 1.1
    identifier: BUSL-1.1
servers:
  - url: /
    description: Same origin as the FamilyFi application
tags:
  - name: Health
    description: Deployment health and readiness
  - name: Auth
    description: Recovery admin and personal adult sessions
  - name: Accounts
    description: Personal adult administration; recovery admin is permanent
  - name: Settings
    description: Household timezone and UniFi connection
  - name: Groups
    description: Family and Things
  - name: Devices
    description: Assigned and quarantined devices
  - name: Sync
    description: Reconciliation and per-action change status
  - name: DPI
    description: UniFi DPI category and application catalog (server-side proxy)
  - name: Rules
    description: Category and app rules including network scope (Internet parents remain groups)
  - name: Upstream
    description: Domain-list categories checked against the household resolver (reporting only)
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Deployment health
      description: Minimal non-secret readiness. Does not expose credentials.
      security: []
      responses:
        "200":
          description: Application and database are reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              examples:
                ok:
                  value: { status: ok, db: ok, version: "0.1.0", revision: 0 }
        "503":
          description: Application is up but the database is not.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Sign in
      description: |
        Authenticate the recovery username `admin` against FAMILYFI_DEFAULT_PASSWORD,
        or a personal adult account against its stored password hash.
        Browser clients receive an httpOnly session cookie and a readable CSRF
        cookie. Native clients set `client` to `native` and receive a bearer
        token instead of cookies. Five failed attempts in 15 minutes for a
        username or IP return 429. Sessions last 30 days unless revoked.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              browser:
                value: { username: admin, password: "example-password", client: browser }
              native:
                value: { username: admin, password: "example-password", client: native }
      responses:
        "200":
          description: Authenticated.
          headers:
            Set-Cookie:
              description: Browser logins set familyfi_session (httpOnly) and familyfi_csrf.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Sign out
      description: |
        Revokes the current session. Cookie clients must send header
        `X-CSRF-Token` matching the `familyfi_csrf` cookie. Bearer clients
        send `Authorization: Bearer`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Session revoked.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/auth/session:
    get:
      operationId: getSession
      tags: [Auth]
      summary: Current session
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The caller is authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/accounts:
    get:
      operationId: listAccounts
      tags: [Accounts]
      summary: List recovery and personal accounts
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Accounts without password hashes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
        "401":
          $ref: "#/components/responses/Error"
    post:
      operationId: createAccount
      tags: [Accounts]
      summary: Create a personal adult account
      description: Username cannot be admin. groupId must be an adult Family group.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [account, change]
                properties:
                  account: { $ref: "#/components/schemas/Account" }
                  change: { $ref: "#/components/schemas/Change" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/accounts/{id}:
    get:
      operationId: getAccount
      tags: [Accounts]
      summary: Get an account
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AccountId" }]
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [account]
                properties:
                  account: { $ref: "#/components/schemas/Account" }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: updateAccount
      tags: [Accounts]
      summary: Update a personal account
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [account, change]
                properties:
                  account: { $ref: "#/components/schemas/Account" }
                  change: { $ref: "#/components/schemas/Change" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAccount
      tags: [Accounts]
      summary: Delete a personal account
      description: Revokes that account's sessions. Recovery admin cannot be deleted.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, change]
                properties:
                  ok: { type: boolean, const: true }
                  change: { $ref: "#/components/schemas/Change" }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/accounts/{id}/password:
    put:
      operationId: updateAccountPassword
      tags: [Accounts]
      summary: Set a personal account password
      description: Revokes existing sessions for that account. Recovery admin uses FAMILYFI_DEFAULT_PASSWORD.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, minLength: 8 }
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [account, change]
                properties:
                  account: { $ref: "#/components/schemas/Account" }
                  change: { $ref: "#/components/schemas/Change" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/settings/household:
    get:
      operationId: getHousehold
      tags: [Settings]
      summary: Household timezone and quarantine enforcement
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Household settings
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [household]
                properties:
                  household:
                    $ref: "#/components/schemas/Household"
        "401":
          $ref: "#/components/responses/Error"
    put:
      operationId: updateHousehold
      tags: [Settings]
      summary: Update timezone or quarantine enforcement
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                timezone: { type: string, example: America/New_York }
                quarantineEnforced:
                  type: boolean
                  description: |
                    When false, app-owned quarantine policies are PUT enabled false (emergency override).
                    Assignment is unchanged. When true, unassigned in-scope MACs are blocked again.
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [household, change]
                properties:
                  household: { $ref: "#/components/schemas/Household" }
                  change: { $ref: "#/components/schemas/Change" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/settings/unifi:
    get:
      operationId: getUnifiSettings
      tags: [Settings]
      summary: Masked UniFi connection
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Never returns the raw API key
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [unifi]
                properties:
                  unifi: { $ref: "#/components/schemas/UnifiSettings" }
        "401":
          $ref: "#/components/responses/Error"
    put:
      operationId: updateUnifiSettings
      tags: [Settings]
      summary: Validate and save UniFi credentials or managed networks
      description: |
        Probes UniFi before saving a new key. Failure preserves the previous key.
        After a key exists, PUT may send only manageAllNetworks / managedNetworkIds.
        Discovery and quarantine only watch those UniFi networks (VLANs).
        manageAllNetworks true watches every network on the site.
        An empty allowlist with manageAllNetworks false watches none.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnifiSettingsWrite" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [unifi, change]
                properties:
                  unifi: { $ref: "#/components/schemas/UnifiSettings" }
                  change: { $ref: "#/components/schemas/Change" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/settings/unifi/test:
    post:
      operationId: testUnifiSettings
      tags: [Settings]
      summary: Probe UniFi without saving; omit apiKey to test the stored key
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnifiProbeRequest" }
      responses:
        "200":
          description: Reachable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, applicationVersion, site, siteCount, networks]
                properties:
                  ok: { type: boolean, const: true }
                  applicationVersion: { type: string }
                  site:
                    type: object
                    additionalProperties: false
                    required: [id, name]
                    properties:
                      id: { type: string }
                      name: { type: string }
                  siteCount: { type: integer }
                  networks:
                    type: array
                    items: { $ref: "#/components/schemas/UnifiNetwork" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/groups:
    get:
      operationId: listGroups
      tags: [Groups]
      summary: List Family and Things groups
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [groups]
                properties:
                  groups:
                    type: array
                    items: { $ref: "#/components/schemas/Group" }
        "401":
          $ref: "#/components/responses/Error"
    post:
      operationId: createGroup
      tags: [Groups]
      summary: Create a group
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [group, change]
                properties:
                  group: { $ref: "#/components/schemas/Group" }
                  change: { $ref: "#/components/schemas/Change" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/groups/{id}:
    get:
      operationId: getGroup
      tags: [Groups]
      summary: Get a group
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      responses:
        "200":
          description: Group
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [group]
                properties:
                  group: { $ref: "#/components/schemas/Group" }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: updateGroup
      tags: [Groups]
      summary: Update a group
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/GroupId" }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [group, change]
                properties:
                  group: { $ref: "#/components/schemas/Group" }
                  change: { $ref: "#/components/schemas/Change" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteGroup
      tags: [Groups]
      summary: Delete a group
      description: Devices in the group become quarantined.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/GroupId" }
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, change]
                properties:
                  ok: { type: boolean, const: true }
                  change: { $ref: "#/components/schemas/Change" }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/groups/{id}/schedule:
    put:
      operationId: updateGroupSchedule
      tags: [Groups]
      summary: Set recurring bedtime
      description: Persisted to UniFi policy schedule. Does not toggle enabled at window edges.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/GroupId" }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Schedule" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [group, change]
                properties:
                  group: { $ref: "#/components/schemas/Group" }
                  change: { $ref: "#/components/schemas/Change" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/groups/{id}/pause:
    post:
      operationId: pauseGroup
      tags: [Groups]
      summary: Pause internet policy (Always or Scheduled)
      description: Sets UniFi policy enabled false for Always or Scheduled modes. Omit until for an indefinite pause. Protected groups still return 409.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/GroupId" }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                until:
                  type: [string, "null"]
                  format: date-time
      responses:
        "200":
          description: Paused
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [group, change]
                properties:
                  group: { $ref: "#/components/schemas/Group" }
                  change: { $ref: "#/components/schemas/Change" }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/groups/{id}/resume:
    post:
      operationId: resumeGroup
      tags: [Groups]
      summary: Resume internet policy (Always or Scheduled)
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/GroupId" }
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "200":
          description: Resumed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [group, change]
                properties:
                  group: { $ref: "#/components/schemas/Group" }
                  change: { $ref: "#/components/schemas/Change" }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/groups/{id}/extend:
    post:
      operationId: extendGroupPause
      tags: [Groups]
      summary: Extend a timed pause
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/GroupId" }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [minutes]
              properties:
                minutes: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Extended
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [group, change]
                properties:
                  group: { $ref: "#/components/schemas/Group" }
                  change: { $ref: "#/components/schemas/Change" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/dpi/categories:
    get:
      operationId: listDpiCategories
      tags: [DPI]
      summary: List UniFi DPI categories
      description: |
        Proxies UniFi `GET /v1/dpi/categories`. Returns integer ids and catalog
        names. Includes confirmed curated slots (Video / Social / Gaming / VPN /
        Messaging; no Porn curated slot). Secrets never leave the server.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: filter
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: DPI categories
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [categories, curated]
                properties:
                  categories:
                    type: array
                    items: { $ref: "#/components/schemas/DpiCatalogItem" }
                  curated: { $ref: "#/components/schemas/CuratedCategoryMap" }
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/dpi/applications:
    get:
      operationId: listDpiApplications
      tags: [DPI]
      summary: List UniFi DPI applications
      description: Proxies UniFi `GET /v1/dpi/applications` with optional name filter.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: filter
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: DPI applications
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [applications]
                properties:
                  applications:
                    type: array
                    items: { $ref: "#/components/schemas/DpiCatalogItem" }
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/rules:
    get:
      operationId: listRules
      tags: [Rules]
      summary: List category, app, and network-scoped rules
      description: Internet parents are group schedule/mode rows, not returned here.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: groupId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [rules]
                properties:
                  rules:
                    type: array
                    items: { $ref: "#/components/schemas/Rule" }
        "401":
          $ref: "#/components/responses/Error"
    post:
      operationId: createRule
      tags: [Rules]
      summary: Create a category or app rule
      description: |
        Group/MAC scope only in Phase 2. Protected groups are rejected.
        Stores UniFi DPI integer ids (no free-text category/app names in policy bodies).
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleCreate" }
            examples:
              category:
                value: { kind: category, groupId: grp_example, targetIds: [4], mode: always }
              app:
                value: { kind: app, groupId: grp_example, targetIds: [10001], mode: always }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [rule, change]
                properties:
                  rule: { $ref: "#/components/schemas/Rule" }
                  change: { $ref: "#/components/schemas/Change" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/rules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getRule
      tags: [Rules]
      summary: Get a rule
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Rule
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [rule]
                properties:
                  rule: { $ref: "#/components/schemas/Rule" }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateRule
      tags: [Rules]
      summary: Update a rule
      description: Update mode, schedule, enabled, or target ids. Internet policies are never mutated here.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [rule, change]
                properties:
                  rule: { $ref: "#/components/schemas/Rule" }
                  change: { $ref: "#/components/schemas/Change" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteRule
      tags: [Rules]
      summary: Delete a category or app rule
      description: |
        Deletes the rule and its recorded UniFi policy ids only.
        Internet AppPolicy rows are never touched.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [change]
                properties:
                  change: { $ref: "#/components/schemas/Change" }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/rules/{id}/off:
    post:
      operationId: turnOffRule
      tags: [Rules]
      summary: Turn off a rule
      description: Sets desired enabled false (UniFi Pause). Does not change Internet group policy.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "200":
          description: Turned off
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [rule, change]
                properties:
                  rule: { $ref: "#/components/schemas/Rule" }
                  change: { $ref: "#/components/schemas/Change" }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/devices:
    get:
      operationId: listDevices
      tags: [Devices]
      summary: List devices
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: assignment
          in: query
          schema:
            type: string
            enum: [assigned, quarantined]
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/devices/{mac}:
    get:
      operationId: getDevice
      tags: [Devices]
      summary: Get a device
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Mac" }]
      responses:
        "200":
          description: Device
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [device]
                properties:
                  device: { $ref: "#/components/schemas/Device" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/devices/{mac}/assignment:
    put:
      operationId: assignDevice
      tags: [Devices]
      summary: Assign a device or return it to quarantine
      description: groupId null quarantines the device.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Mac" }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [groupId]
              properties:
                groupId:
                  type: [string, "null"]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [device, change]
                properties:
                  device: { $ref: "#/components/schemas/Device" }
                  change: { $ref: "#/components/schemas/Change" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/sync:
    get:
      operationId: getSync
      tags: [Sync]
      summary: Latest reconciliation
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Sync status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncStatus" }
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/sync/retry:
    post:
      operationId: retrySync
      tags: [Sync]
      summary: Queue another reconciliation
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [change]
                properties:
                  change: { $ref: "#/components/schemas/Change" }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/changes/{id}:
    get:
      operationId: getChange
      tags: [Sync]
      summary: Poll a mutation
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Change
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [change]
                properties:
                  change: { $ref: "#/components/schemas/Change" }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/upstream/categories:
    get:
      operationId: listUpstreamCategories
      tags: [Upstream]
      summary: List upstream categories with their domains and last verdict
      description: |
        Reporting only. These categories never create a UniFi policy, so no response
        here carries a change envelope. Removed seeded domains are included so the UI
        can show them struck through and offer to restore them.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [categories]
                properties:
                  categories:
                    type: array
                    items: { $ref: "#/components/schemas/UpstreamCategory" }
        "401":
          $ref: "#/components/responses/Error"
    post:
      operationId: createUpstreamCategory
      tags: [Upstream]
      summary: Create a custom category
      description: Always report-only, with source user. The slug is derived from the label.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpstreamCategoryCreate" }
            examples:
              homework:
                value: { label: Homework, monogram: HW, domains: [chegg.com] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [category]
                properties:
                  category: { $ref: "#/components/schemas/UpstreamCategory" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/upstream/categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getUpstreamCategory
      tags: [Upstream]
      summary: Get one upstream category
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [category]
                properties:
                  category: { $ref: "#/components/schemas/UpstreamCategory" }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateUpstreamCategory
      tags: [Upstream]
      summary: Update a category or replace its domain list
      description: |
        The domains array is the whole ACTIVE list and replaces what is stored.
        Including a struck-through seeded domain restores it; leaving one out strikes
        it. A domain the household added is deleted outright when left out, because
        there is nothing to restore it to. A built-in category's label follows
        FamilyFi updates and cannot be changed here.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpstreamCategoryUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [category]
                properties:
                  category: { $ref: "#/components/schemas/UpstreamCategory" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteUpstreamCategory
      tags: [Upstream]
      summary: Delete a custom category
      description: |
        Only a custom category can be deleted. A built-in one would be recreated by
        the boot reconcile, so deleting it is refused with 409 — turn checking off
        instead.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok]
                properties:
                  ok: { type: boolean }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/upstream/categories/{id}/check:
    post:
      operationId: checkUpstreamCategory
      tags: [Upstream]
      summary: Check one category now
      description: |
        Runs a sweep for this category and returns it with the new verdict. Returns 200
        even when the resolver could not be reached — that is a verdict of unknown to
        show, not a failed request.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "200":
          description: Checked
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [category]
                properties:
                  category: { $ref: "#/components/schemas/UpstreamCategory" }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/upstream/checks:
    get:
      operationId: listUpstreamChecks
      tags: [Upstream]
      summary: Latest verdict per category
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Checks
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [checks]
                properties:
                  checks:
                    type: array
                    items: { $ref: "#/components/schemas/UpstreamCheckRow" }
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/upstream/checks/run:
    post:
      operationId: runUpstreamChecks
      tags: [Upstream]
      summary: Sweep every category with checking on
      description: Categories with checking off are skipped and keep their last verdict.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "200":
          description: Swept
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [outcomes]
                properties:
                  outcomes:
                    type: array
                    items: { $ref: "#/components/schemas/UpstreamProbeOutcome" }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/upstream/resolver:
    get:
      operationId: getUpstreamResolver
      tags: [Upstream]
      summary: Household DNS-over-HTTPS endpoint
      description: |
        Returned in full. A resolver URL is configuration rather than a credential — a
        profile id in its path lets someone spend that profile's quota, not read its
        logs or change a setting — and hiding it left a mistyped endpoint invisible
        behind an unknown verdict.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Resolver settings
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [resolver]
                properties:
                  resolver: { $ref: "#/components/schemas/UpstreamResolver" }
        "401":
          $ref: "#/components/responses/Error"
    put:
      operationId: updateUpstreamResolver
      tags: [Upstream]
      summary: Set the endpoint or the sweep schedule
      description: |
        Changing the URL immediately clears household verdicts. Saving the same URL
        or disabling checking preserves them. In-flight results from a replaced
        endpoint are discarded.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpstreamResolverUpdate" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [resolver]
                properties:
                  resolver: { $ref: "#/components/schemas/UpstreamResolver" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    delete:
      operationId: clearUpstreamResolver
      tags: [Upstream]
      summary: Clear the endpoint and turn checking off
      description: |
        Immediately clears household verdicts and disables automatic checking.
        Group override verdicts are preserved. In-flight results for the removed
        endpoint cannot restore household verdicts.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok]
                properties:
                  ok: { type: boolean }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/groups/{id}/resolver:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: setGroupResolver
      tags: [Upstream]
      summary: Point this group's upstream checks at its own endpoint
      description: |
        Reporting only, like the rest of Upstream. This changes which resolver FamilyFi
        asks about this group, so its category verdicts describe its own devices
        instead of the household's. It does not change what reaches those devices —
        pointing them at the resolver is a DHCP or client-side job.
        Changing the URL immediately clears this group's verdicts; saving the same
        URL preserves them. In-flight results from the replaced endpoint are discarded.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url]
              properties:
                url: { type: string, description: Absolute https URL. }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [group]
                properties:
                  group: { $ref: "#/components/schemas/Group" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: clearGroupResolver
      tags: [Upstream]
      summary: Return this group to the household endpoint
      description: |
        Drops the group's own verdicts with the override. They describe an endpoint it
        no longer uses, and keeping them would leave a stale answer on its cards until
        the next sweep.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [group]
                properties:
                  group: { $ref: "#/components/schemas/Group" }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: familyfi_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Revocable session token from POST /api/v1/auth/login with client=native.
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for cookie-authenticated mutations. Must match familyfi_csrf.
      schema: { type: string }
    AccountId:
      name: id
      in: path
      required: true
      schema: { type: string }
    GroupId:
      name: id
      in: path
      required: true
      schema: { type: string }
    Mac:
      name: mac
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, db, version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        db:
          type: string
          enum: [ok, error, unconfigured]
        version:
          type: string
          description: Application semver from package.json (no leading v).
        revision:
          type: integer
          minimum: 0
        error:
          type: string
          description: Present when status is degraded due to configuration, not secrets.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
        client:
          type: string
          enum: [browser, native]
          default: browser
    Session:
      type: object
      additionalProperties: false
      required: [username, displayName, kind, expiresAt]
      properties:
        username: { type: string }
        displayName: { type: string }
        kind:
          type: string
          enum: [recovery, personal]
        expiresAt:
          type: string
          format: date-time
    LoginResponse:
      type: object
      additionalProperties: false
      required: [session]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        token:
          type: string
          description: Present for native clients only.
        tokenType:
          type: string
          enum: [Bearer]
    SessionResponse:
      type: object
      additionalProperties: false
      required: [session]
      properties:
        session:
          $ref: "#/components/schemas/Session"
    Account:
      type: object
      additionalProperties: false
      required: [id, username, displayName, kind, isAdmin, recovery]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        kind: { type: string, enum: [recovery, personal] }
        isAdmin: { type: boolean }
        groupId: { type: [string, "null"] }
        recovery: { type: boolean }
    AccountCreate:
      type: object
      additionalProperties: false
      required: [username, displayName, password, groupId]
      properties:
        username: { type: string, minLength: 2 }
        displayName: { type: string }
        password: { type: string, minLength: 8 }
        groupId: { type: string }
        isAdmin: { type: boolean }
    AccountUpdate:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string }
        groupId: { type: string }
        isAdmin: { type: boolean }
    Household:
      type: object
      additionalProperties: false
      required: [timezone, revision, quarantineEnforced, quarantineObservedEnabled, quarantinePolicyCount]
      properties:
        timezone: { type: string }
        revision: { type: integer, minimum: 0 }
        quarantineEnforced: { type: boolean }
        quarantineObservedEnabled:
          type: [boolean, "null"]
          description: Live UniFi enabled flag across app-owned quarantine policies. True if any is enabled.
        quarantinePolicyCount: { type: integer, minimum: 0 }
    UnifiSettings:
      type: object
      additionalProperties: false
      required: [configured, connectionStatus, tlsInsecure, manageAllNetworks, managedNetworkIds, networks]
      properties:
        configured: { type: boolean }
        mode: { type: [string, "null"] }
        baseUrl: { type: [string, "null"] }
        consoleId: { type: [string, "null"] }
        siteId: { type: [string, "null"] }
        apiKeyMasked: { type: [string, "null"] }
        tlsInsecure: { type: boolean }
        manageAllNetworks: { type: boolean }
        managedNetworkIds:
          type: array
          items: { type: string }
        networks:
          type: array
          items: { $ref: "#/components/schemas/UnifiNetwork" }
        connectionStatus: { type: string }
        connectionError: { type: [string, "null"] }
    UnifiNetwork:
      type: object
      additionalProperties: false
      required: [id, name, vlanId]
      properties:
        id: { type: string }
        name: { type: string }
        vlanId: { type: integer }
        zoneId: { type: [string, "null"] }
    UnifiProbeRequest:
      type: object
      additionalProperties: false
      properties:
        apiKey: { type: string, minLength: 8 }
        baseUrl: { type: string }
        consoleId: { type: string }
        siteId: { type: string }
        tlsInsecure: { type: boolean }
    UnifiSettingsWrite:
      type: object
      additionalProperties: false
      properties:
        apiKey: { type: string, minLength: 8 }
        baseUrl: { type: string }
        consoleId: { type: string }
        siteId: { type: string }
        tlsInsecure: { type: boolean }
        manageAllNetworks: { type: boolean }
        managedNetworkIds:
          type: array
          items: { type: string }

    DpiCatalogItem:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    CuratedCategoryCandidate:
      type: object
      additionalProperties: false
      required: [slot, label, categoryId, catalogName]
      properties:
        slot: { type: string, enum: [video, social, gaming, vpn, messaging] }
        label: { type: string }
        categoryId: { type: integer }
        catalogName: { type: string }
    CuratedCategoryMap:
      type: object
      additionalProperties: false
      required: [status, candidates]
      description: |
        Confirmed curated slots — Video (4), Social (24), Gaming (8), VPN (11),
        Messaging (0). No Porn curated slot. Messaging's id is zero, so clients
        must not treat a category id as falsy.
      properties:
        status: { type: string, enum: [provisional, confirmed] }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/CuratedCategoryCandidate" }
    Rule:
      type: object
      additionalProperties: false
      required: [id, kind, scope, groupId, networkIds, targetIds, enabled, mode, schedule, internet]
      properties:
        id: { type: string }
        kind: { type: string, enum: [category, app] }
        scope:
          type: string
          enum: [group, network]
          description: group = member/Things MAC source; network = Settings-managed NETWORK source
        groupId:
          type: [string, "null"]
          description: Required when scope=group; null for network-scoped rules
        networkIds:
          type: array
          items: { type: string, format: uuid }
          description: Managed UniFi network ids when scope=network; empty for group scope
        targetIds:
          type: array
          items: { type: integer }
          minItems: 1
          maxItems: 100
        enabled: { type: boolean }
        mode: { type: string, enum: [always, scheduled] }
        schedule: { $ref: "#/components/schemas/Schedule" }
        internet:
          type: boolean
          enum: [false]
          description: Category/app rules are never Internet parents.
    RuleCreate:
      type: object
      additionalProperties: false
      required: [kind, targetIds]
      properties:
        kind: { type: string, enum: [category, app] }
        scope:
          type: string
          enum: [group, network]
          default: group
          description: Omit or group for member scope; network requires managed networkIds (D9)
        groupId:
          type: string
          description: Required when scope is group (default)
        networkIds:
          type: array
          items: { type: string, format: uuid }
          minItems: 1
          description: Required when scope=network; must be Settings-managed (or any site network when manage-all)
        targetIds:
          type: array
          items: { type: integer }
          minItems: 1
          maxItems: 100
        enabled: { type: boolean }
        mode: { type: string, enum: [always, scheduled] }
        schedule: { $ref: "#/components/schemas/Schedule" }
    RuleUpdate:
      type: object
      additionalProperties: false
      properties:
        targetIds:
          type: array
          items: { type: integer }
          minItems: 1
          maxItems: 100
        networkIds:
          type: array
          items: { type: string, format: uuid }
          minItems: 1
          description: Only valid for network-scoped rules; managed ids only
        enabled: { type: boolean }
        mode: { type: string, enum: [always, scheduled] }
        schedule: { $ref: "#/components/schemas/Schedule" }
    Schedule:
      type: object
      additionalProperties: false
      required: [enabled, days, start, end]
      properties:
        enabled: { type: boolean }
        days:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
        start: { type: [string, "null"] }
        end: { type: [string, "null"] }
    Suspension:
      type: object
      additionalProperties: false
      required: [active, until]
      properties:
        active: { type: boolean }
        until: { type: [string, "null"], format: date-time }
    Group:
      type: object
      additionalProperties: false
      required: [id, kind, name, protected, mode, deviceCount, schedule, suspension, access, dohOverrideUrl]
      properties:
        id: { type: string }
        kind: { type: string, enum: [family, things] }
        name: { type: string }
        monogram: { type: [string, "null"] }
        familyRole: { type: [string, "null"], enum: [child, teen, adult] }
        protected: { type: boolean }
        mode: { type: string, enum: [always, scheduled], description: "always = permanent internet block (UniFi schedule omitted); scheduled = bedtime window" }
        deviceCount: { type: integer, minimum: 0 }
        schedule: { $ref: "#/components/schemas/Schedule" }
        suspension: { $ref: "#/components/schemas/Suspension" }
        access: { type: string, enum: [available, blocked, paused, protected, always_on] }
        dohOverrideUrl:
          type: [string, "null"]
          description: |
            This group's own DoH endpoint, or null to read the household default. A card
            uses it to resolve its own upstream verdict rather than the household's.
    GroupCreate:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind: { type: string, enum: [family, things] }
        name: { type: string }
        monogram: { type: string, maxLength: 4 }
        familyRole: { type: string, enum: [child, teen, adult] }
        protected: { type: boolean }
    GroupUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        monogram: { type: [string, "null"] }
        familyRole: { type: [string, "null"], enum: [child, teen, adult] }
        protected: { type: boolean }
    Device:
      type: object
      additionalProperties: false
      required: [mac, assignment, unresolved, inScope]
      properties:
        mac: { type: string }
        hostname: { type: [string, "null"] }
        ip: { type: [string, "null"] }
        networkId: { type: [string, "null"] }
        zoneId: { type: [string, "null"] }
        groupId: { type: [string, "null"] }
        assignment: { type: string, enum: [assigned, quarantined] }
        lastSeenAt: { type: [string, "null"], format: date-time }
        unresolved: { type: boolean }
        inScope: { type: boolean }
    Change:
      type: object
      additionalProperties: false
      required: [id, revision, status, scope, updatedAt]
      properties:
        id: { type: string }
        revision: { type: integer }
        appliedRevision: { type: [integer, "null"] }
        status: { type: string, enum: [pending, applied, partial, failed, superseded] }
        scope: { type: string }
        deviceMac: { type: [string, "null"] }
        error: { type: [string, "null"] }
        updatedAt: { type: string, format: date-time }
    SyncStatus:
      type: object
      additionalProperties: false
      required: [revision, connectionStatus, appPolicyCount, failingCount, changes, issues]
      properties:
        revision: { type: integer }
        connectionStatus: { type: string }
        appPolicyCount: { type: integer }
        failingCount: { type: integer }
        issues:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [groupId, groupName, kind, message]
            properties:
              groupId: { type: string }
              groupName: { type: string }
              kind: { type: string, enum: [no_members, unresolved_zone, missing_policy] }
              message: { type: string }
        lastRun:
          type: [object, "null"]
          additionalProperties: false
          properties:
            id: { type: string }
            status: { type: string }
            requestedRevision: { type: integer }
            appliedRevision: { type: [integer, "null"] }
            startedAt: { type: string, format: date-time }
            finishedAt: { type: [string, "null"], format: date-time }
            error: { type: [string, "null"] }
        changes:
          type: array
          items: { $ref: "#/components/schemas/Change" }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    UpstreamDomain:
      type: object
      additionalProperties: false
      required: [id, domain, source, removed]
      properties:
        id: { type: string }
        domain: { type: string }
        source: { type: string, enum: [seed, user] }
        removed:
          type: boolean
          description: A seeded domain the household removed. Shown struck through and restorable.
    UpstreamDomainResult:
      type: object
      additionalProperties: false
      required: [domain, blocked]
      properties:
        domain: { type: string }
        blocked:
          type: [boolean, "null"]
          description: Null means this domain could not be resolved — unknown, never "not blocked".
    UpstreamCheck:
      type: object
      additionalProperties: false
      required: [verdict, blockedCount, totalCount, checkedAt, error, groupId, results]
      properties:
        verdict:
          type: string
          enum: [blocked, partial, open, unknown]
          description: unknown means the resolver could not be reached, never that nothing is blocked.
        blockedCount: { type: integer }
        totalCount: { type: integer }
        checkedAt: { type: string, format: date-time }
        error: { type: [string, "null"] }
        groupId:
          type: [string, "null"]
          description: The group this was measured for. Null is the household default.
        results:
          type: array
          description: One entry per domain probed in this sweep. A domain removed since is absent.
          items: { $ref: "#/components/schemas/UpstreamDomainResult" }
    UpstreamCategory:
      type: object
      additionalProperties: false
      required: [id, slug, label, monogram, source, enabled, domains, activeDomainCount, costNote, checks]
      properties:
        id: { type: string }
        slug: { type: string }
        label: { type: string }
        monogram: { type: string, maxLength: 3 }
        source: { type: string, enum: [seed, user] }
        enabled:
          type: boolean
          description: Turns checking on or off only. It never blocks or unblocks anything.
        domains:
          type: array
          items: { $ref: "#/components/schemas/UpstreamDomain" }
        activeDomainCount: { type: integer }
        costNote: { type: string }
        checks:
          type: array
          description: |
            Every verdict measured for this category — the household default plus one
            per group with its own resolver. A card resolves its own: a group with an
            override reads the row carrying its id, any other group reads the row with
            a null groupId.
          items: { $ref: "#/components/schemas/UpstreamCheck" }
    UpstreamCategoryCreate:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label: { type: string, minLength: 1, maxLength: 60 }
        monogram: { type: string, minLength: 1, maxLength: 3 }
        domains:
          type: array
          items: { type: string }
        enabled: { type: boolean }
    UpstreamCategoryUpdate:
      type: object
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 60 }
        monogram: { type: string, minLength: 1, maxLength: 3 }
        enabled: { type: boolean }
        domains:
          type: array
          description: The whole active list, replacing what is stored.
          items: { type: string }
    UpstreamCheckRow:
      type: object
      additionalProperties: false
      required: [categoryId, slug, label, verdict, blockedCount, totalCount, checkedAt, error, groupId, results]
      properties:
        categoryId: { type: string }
        slug: { type: string }
        label: { type: string }
        verdict: { type: string, enum: [blocked, partial, open, unknown] }
        blockedCount: { type: integer }
        totalCount: { type: integer }
        checkedAt: { type: string, format: date-time }
        error: { type: [string, "null"] }
        groupId:
          type: [string, "null"]
          description: The group this was measured for. Null is the household default.
        results:
          type: array
          description: One entry per domain probed in this sweep. A domain removed since is absent.
          items: { $ref: "#/components/schemas/UpstreamDomainResult" }
    UpstreamProbeOutcome:
      type: object
      additionalProperties: false
      required: [categoryId, slug, verdict, blockedCount, totalCount]
      properties:
        categoryId: { type: string }
        slug: { type: string }
        verdict: { type: string, enum: [blocked, partial, open, unknown] }
        blockedCount: { type: integer }
        totalCount: { type: integer }
    UpstreamResolver:
      type: object
      additionalProperties: false
      required: [configured, url, probeEnabled, probeTime, probeDays, timeoutMs, lastRunAt, nextRunAt]
      properties:
        configured: { type: boolean }
        url:
          type: [string, "null"]
          description: The endpoint in full, e.g. https://dns.example.com/dns-query/profile
        probeEnabled: { type: boolean }
        probeTime: { type: string, description: "Household-local HH:MM, 24-hour." }
        probeDays:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
          description: 0 (Sunday) through 6 (Saturday). Empty means checking never runs.
        timeoutMs: { type: integer }
        lastRunAt:
          type: [string, "null"]
          format: date-time
          description: The most recent completed sweep, or null if none yet.
        nextRunAt:
          type: [string, "null"]
          format: date-time
          description: The next scheduled sweep, or null when checking is off or no days are selected.
    UpstreamResolverUpdate:
      type: object
      additionalProperties: false
      properties:
        url: { type: string, description: Absolute https URL. }
        probeEnabled: { type: boolean }
        probeTime: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: "Household-local HH:MM, 24-hour." }
        probeDays:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
        timeoutMs: { type: integer, minimum: 500, maximum: 30000 }
