      summary: Pause a rule (lift it for a while)
      description: |
        Suspends the rule for every group it covers, from now until `until` or until resumed;
        omit `until` for an indefinite pause. The rule's policies stay on the gateway, disabled.
        Records who paused it and replaces an earlier pause or allowance. A rule that is off
        answers 409 `rule_off`; an `until` in the past answers 400. A group's own pause is
        separate and unchanged. Pausing the built-in quarantine rule lets unassigned devices online
        until it ends: its policies stay on the gateway, disabled. To suspend the rule for one group only, use
        `/groups/{id}/rules/{ruleId}/pause`.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                until:
                  type: [string, "null"]
                  format: date-time
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [rule, change]
                properties:
                  rule: { $ref: "#/components/schemas/Rule" }
                  change: { $ref: "#/components/schemas/ChangeSummary" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
