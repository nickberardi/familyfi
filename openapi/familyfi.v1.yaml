  /api/v1/groups/{id}/rules/{ruleId}/allow:
    post:
      operationId: allowGroupRule
      tags: [Rules]
      summary: Allow a rule for one group
      description: |
        Overrides the rule for one group alone. 404 when the group does not have the rule. The same verb as the rule-wide route, with the same meaning: only whose devices are affected differs. Its devices leave the rule's policies; a policy left with no other device stays disabled with its devices so ending the lift does not recreate it. Same request and errors as `/rules/{id}/allow`.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: ruleId
          in: path
          required: true
          description: |
            A rule the group has, or the reserved `internet`: the group's built-in rule "this
            group has internet". The verbs mean the same to it. `pause` suspends it, so all
            internet is blocked now (a hidden always-on block rule is enabled until `until` or
            until resumed); `resume` ends that; `extend` adds time to it; `allow` overrides the
            group's internet rules until `until` (default: each rule's active windows end; 409
            `not_in_window` when none is blocking); `disallow` ends that. Pause and allow
            replace each other. The response carries `group` instead of `rule`.
          schema: { type: string }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: false
