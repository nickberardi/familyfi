                required: [ok, change]
                properties:
                  ok: { type: boolean, const: true }
                  change: { $ref: "#/components/schemas/ChangeSummary" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/devices/{mac}/assignment:
    put:
      operationId: assignDevice
