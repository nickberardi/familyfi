openapi: 3.1.0
info:
  title: FamilyFi API
  version: 0.28.0
  description: |
    Versioned HTTP API used by the FamilyFi web/PWA, the iPhone app, and paired
    AI agents. An agent starts at `/agents.md` on the same origin. Application state is desired configuration; UniFi is
    enforcement only. Signed-in operators can browse this specification under
    System → API (`/reference`). Groups, devices, accounts, UniFi settings, and
    sync are specified here.

    A server in demo mode (the hosted public demo, where every visitor shares one
    household) refuses configuration writes with 403 `demo_locked`: household and
    UniFi settings, accounts and passwords, the household's and groups' resolvers,
    connection routes and their certificate pins, and remote access. Groups, rules, pauses, devices and pairing
    work as usual.
  license:
    name: Business Source License 1.1
    identifier: BUSL-1.1
servers:
  - url: /
    description: Same origin as the FamilyFi application
tags:
  - name: Health
    description: Deployment health and readiness
  - name: Auth
    description: Recovery admin and personal adult sessions
  - name: Accounts
    description: Personal adult administration; recovery admin is permanent
  - name: Settings
    description: Household timezone and UniFi connection
  - name: Update
    description: Installing a newer release through the Watchtower sidecar, now or on a schedule. Administrators only.
  - name: Groups
    description: Family and Things
  - name: Devices
    description: Assigned and quarantined devices
  - name: Sync
    description: Reconciliation and per-action change status
  - name: DPI
    description: UniFi DPI category and application catalog (server-side proxy)
  - name: Rules
    description: Category and app rules including network scope (Internet parents remain groups)
  - name: Upstream
    description: Domain-list categories checked against the household resolver (reporting only)
  - name: Paired
    description: Phones, Watches and agents that call the API. Invites join them; devices manage them.
  - name: Connection
    description: |
      Paired native devices, trusted HTTPS endpoints, and connection status.
      Administrator reads (GET) need only the session; writes also need the CSRF header.
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Deployment health
      description: Minimal non-secret readiness. Does not expose credentials. The optional update snapshot is cached GitHub release metadata and does not affect application readiness.
      security: []
      responses:
        "200":
          description: Application and database are reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              examples:
                ok:
                  value:
                    status: ok
                    db: ok
                    version: "0.1.0"
                    revision: 0
                    update:
                      status: ok
                      available: true
                      currentVersion: "0.1.0"
                      latestVersion: "0.2.0"
                      releaseUrl: https://github.com/nickberardi/familyfi/releases/tag/v0.2.0
                      releaseNotes: "## New\n- Pair Device page"
                      checkedAt: "2026-09-22T12:00:00.000Z"
                      lastSuccessfulAt: "2026-09-22T12:00:00.000Z"
                      error: null
        "503":
          description: Application is up but the database is not.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Sign in
      description: |
        Authenticate the recovery username `admin` against FAMILYFI_DEFAULT_PASSWORD,
        or a personal adult account against its stored password hash. Only administrators
        use FamilyFi: a personal account without administrator access is refused with 403
        `administrator_account_required`, and has no session or paired device.
        Sign-in is for people in a browser: it sets an httpOnly session cookie and a
        readable CSRF cookie, and the session lasts 30 days unless revoked. Phones,
        Watches and agents never sign in here; they join through `/paired/invites`,
        which signs them in. Five failed attempts in 15 minutes for a username or IP
        return 429. Nobody signs in through remote access (403 `remote_browser_login`),
        so the internet cannot test passwords.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              browser:
                value: { username: admin, password: "example-password", client: browser }
      responses:
        "200":
          description: Authenticated.
          headers:
            Set-Cookie:
              description: Browser logins set familyfi_session (httpOnly) and familyfi_csrf.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [Auth]
      summary: Renew a paired device's bearer
      description: |
        Trades a paired device's refresh token for a new one-hour bearer and a new refresh token;
        both old tokens stop working. The refresh token lasts 90 days from its last use. The one
        just replaced is honoured once within a few seconds, for a device that lost the response;
        presenting it again after that means a copy exists, so the whole sign-in is revoked
        (403 `refresh_reused`). An unknown, expired or revoked token, or a revoked device, is
        403 `invalid_refresh`: sign in again. An agent's refresh through remote access is 403
        `agent_remote`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: A new token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Sign out
      description: |
        Revokes the current session. Cookie clients must send header
        `X-CSRF-Token` matching the `familyfi_csrf` cookie. Bearer clients
        send `Authorization: Bearer`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Session revoked.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/auth/session:
    get:
      operationId: getSession
      tags: [Auth]
      summary: Current session
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The caller is authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/accounts:
    get:
      operationId: listAccounts
      tags: [Accounts]
      summary: List recovery and personal accounts
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Accounts without password hashes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
        "401":
          $ref: "#/components/responses/Error"
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAccount
      tags: [Accounts]
      summary: Create a personal adult account
      description: Username cannot be admin. groupId must be an adult Family group.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [account, change]
                properties:
                  account: { $ref: "#/components/schemas/Account" }
                  change: { $ref: "#/components/schemas/ChangeSummary" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/accounts/{id}:
    get:
      operationId: getAccount
      tags: [Accounts]
      summary: Get an account
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AccountId" }]
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [account]
                properties:
                  account: { $ref: "#/components/schemas/Account" }
        "401":
          $ref: "#/components/responses/Error"
        "403": { $ref: "#/components/responses/Error" }
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: updateAccount
      tags: [Accounts]
      summary: Update a personal account
      description: |
        Only administrators use FamilyFi. Setting `isAdmin` to false ends the adult's sessions, removes
        every phone, Watch and agent acting as them, and cancels their pending invites, in the same step.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [account, change]
                properties:
                  account: { $ref: "#/components/schemas/Account" }
                  change: { $ref: "#/components/schemas/ChangeSummary" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAccount
      tags: [Accounts]
      summary: Delete a personal account
      description: Revokes that account's sessions. Recovery admin cannot be deleted.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, change]
                properties:
                  ok: { type: boolean, const: true }
                  change: { $ref: "#/components/schemas/ChangeSummary" }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/accounts/{id}/password:
    put:
      operationId: updateAccountPassword
      tags: [Accounts]
      summary: Set a personal account password
      description: Revokes existing sessions for that account. Recovery admin uses FAMILYFI_DEFAULT_PASSWORD.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, minLength: 8 }
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [account, change]
                properties:
                  account: { $ref: "#/components/schemas/Account" }
                  change: { $ref: "#/components/schemas/ChangeSummary" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/settings/household:
    get:
      operationId: getHousehold
      tags: [Settings]
      summary: Household timezone and quarantine enforcement
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Household settings
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [household]
                properties:
                  household:
                    $ref: "#/components/schemas/Household"
        "401":
          $ref: "#/components/responses/Error"
        "403": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateHousehold
      tags: [Settings]
      summary: Update timezone or quarantine enforcement
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                timezone: { type: string, example: America/New_York }
                quarantineEnforced:
                  type: boolean
                  description: |
                    When false, app-owned quarantine policies are PUT enabled false (emergency override).
                    Assignment is unchanged. When true, unassigned in-scope MACs are blocked again.
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [household, change]
                properties:
                  household: { $ref: "#/components/schemas/Household" }
                  change: { $ref: "#/components/schemas/ChangeSummary" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/settings/export:
    get:
      operationId: exportHousehold
      tags: [Settings]
      summary: Download the household as a .tar.gz export
      description: |
        `manifest.json`, `config.json` (groups, rules and windows, device assignments, administrator accounts
        with their password hashes, DNS categories, the household's own routes and settings) and, where
        `pg_dump` can reach the database, `database.dump` for an exact restore with `pg_restore`. No UniFi key,
        tunnel credential or Access token is in `config.json`; the dump holds them encrypted with this
        install's `FAMILYFI_ENCRYPTION_KEY`, which is never exported. A browser session only: a paired device
        gets 403 `browser_session_required`. 403 `demo_locked` in the demo.
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: The export
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="familyfi-export-2026-10-09.tar.gz"' }
          content:
            application/gzip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/settings/import:
    post:
      operationId: importHousehold
      tags: [Settings]
      summary: Preview or apply a household export
      description: |
        The body is an export from `GET /api/v1/settings/export`. `mode=preview` reads it and says what applying
        it would do, changing nothing. `mode=apply` replaces the groups, rules, device assignments, accounts,
        DNS categories and settings with the export's, then reconciles. A UniFi key, tunnel credential or
        Access token saved here is kept; a route whose token is missing is imported switched off. The importing
        account is never removed or demoted and keeps its password; any other account whose password changes
        is signed out.
        Pairings, paired devices and history are not imported. 400 `invalid_export` for a file FamilyFi did not
        write or a damaged one, 409 `export_too_new` for one a newer FamilyFi wrote, 413 `export_too_large`
        over 50 MB. A browser session only: a paired device gets 403 `browser_session_required`. 403
        `demo_locked` in the demo.
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: mode
          in: query
          required: true
          schema: { type: string, enum: [preview, apply] }
      requestBody:
        required: true
        content:
          application/gzip:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: What the export holds, and for `apply` the change that reconciles it
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [summary, change]
                properties:
                  summary: { $ref: "#/components/schemas/ImportSummary" }
                  change:
                    description: The reconciliation `apply` started; null for `preview`.
                    oneOf:
                      - $ref: "#/components/schemas/ChangeSummary"
                      - type: "null"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/v1/settings/unifi:
    get:
      operationId: getUnifiSettings
      tags: [Settings]
      summary: Masked UniFi connection
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Never returns the raw API key
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [unifi]
                properties:
                  unifi: { $ref: "#/components/schemas/UnifiSettings" }
        "401":
          $ref: "#/components/responses/Error"
        "403": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateUnifiSettings
      tags: [Settings]
      summary: Validate and save UniFi credentials or managed networks
      description: |
        Probes UniFi before saving a new key. Failure preserves the previous key.
        After a key exists, PUT may send only manageAllNetworks / managedNetworkIds.
        Discovery and quarantine only watch those UniFi networks (VLANs).
        manageAllNetworks true watches every network on the site.
        An empty allowlist with manageAllNetworks false watches none.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnifiSettingsWrite" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [unifi, change]
                properties:
                  unifi: { $ref: "#/components/schemas/UnifiSettings" }
                  change: { $ref: "#/components/schemas/ChangeSummary" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/settings/unifi/test:
    post:
      operationId: testUnifiSettings
      tags: [Settings]
      summary: Probe UniFi without saving; omit apiKey to test the stored key
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnifiProbeRequest" }
      responses:
        "200":
          description: Reachable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, applicationVersion, site, siteCount, networks]
                properties:
                  ok: { type: boolean, const: true }
                  applicationVersion: { type: string }
                  site:
                    type: object
                    additionalProperties: false
                    required: [id, name]
                    properties:
                      id: { type: string }
                      name: { type: string }
                  siteCount: { type: integer }
                  networks:
                    type: array
                    items: { $ref: "#/components/schemas/UnifiNetwork" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/settings/update:
    get:
      operationId: getUpdateSettings
      tags: [Update]
      summary: The updater, the automatic schedule and the last install
      description: |
        Whether the Watchtower sidecar is set up (it answers to the token FamilyFi shares with it), when FamilyFi installs a newer
        release on its own, and the last install with its outcome. Reading it settles an install that has
        finished, so a client polls this while `lastRun.status` is `requested`.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Update settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateSettings" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/settings/update/schedule:
    put:
      operationId: updateUpdateSchedule
      tags: [Update]
      summary: Set when FamilyFi installs a newer release on its own
      description: Days and a household-local time. New households install on Sunday at midnight. 403 `demo_locked` in the demo.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSchedule" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateSettings" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/settings/update/install:
    post:
      operationId: installUpdate
      tags: [Update]
      summary: Install the newer release now
      description: |
        Asks the Watchtower sidecar to replace FamilyFi with the release the update check found. Watchtower
        backs up the database first and skips the install when the backup fails. FamilyFi restarts on the
        new release; poll `GET /api/v1/settings/update` for the outcome. 409 `updater_not_configured` when the
        sidecar does not answer to FamilyFi's token, `no_update_available` when there is nothing newer and
        `update_in_progress` while an install is under way; 502 `updater_unreachable` when Watchtower answered
        but failed the request.
        403 `demo_locked` in the demo.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "202":
          description: Watchtower accepted the request
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [run]
                properties:
                  run: { $ref: "#/components/schemas/UpdateRun" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /api/v1/groups:
    get:
      operationId: listGroups
      tags: [Groups]
      summary: List Family and Things groups
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [groups]
                properties:
                  groups:
                    type: array
                    items: { $ref: "#/components/schemas/Group" }
        "401":
          $ref: "#/components/responses/Error"
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createGroup
      tags: [Groups]
      summary: Create a group
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [group, change]
                properties:
                  group: { $ref: "#/components/schemas/Group" }
                  change: { $ref: "#/components/schemas/ChangeSummary" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/groups/{id}:
    get:
      operationId: getGroup
      tags: [Groups]
      summary: Get a group
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
