              type: object
              additionalProperties: false
              properties:
                until:
                  type: [string, "null"]
                  format: date-time
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [rule, change]
                    description: A rule id
