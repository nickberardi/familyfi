                    additionalProperties: false
                    required: [rule, change]
                    description: A rule id
                    properties:
                      rule: { $ref: "#/components/schemas/Rule" }
                      change: { $ref: "#/components/schemas/ChangeSummary" }
                  - type: object
                    additionalProperties: false
                    required: [group, change]
                    description: The reserved id `internet`
                    properties:
                      group: { $ref: "#/components/schemas/Group" }
                      change: { $ref: "#/components/schemas/ChangeSummary" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
