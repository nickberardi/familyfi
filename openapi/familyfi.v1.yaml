openapi: 3.1.0
info:
  title: FamilyFi API
  version: 0.21.0
  description: |
    Versioned HTTP API used by the FamilyFi web/PWA, the iPhone app, and paired
    AI agents. An agent starts at `/agents.md` on the same origin. Application state is desired configuration; UniFi is
    enforcement only. Signed-in operators can browse this specification under
    System → API (`/reference`). Groups, devices, accounts, UniFi settings, and
    sync are specified here.
  license:
    name: Business Source License 1.1
    identifier: BUSL-1.1
servers:
  - url: /
    description: Same origin as the FamilyFi application
tags:
  - name: Health
    description: Deployment health and readiness
  - name: Auth
    description: Recovery admin and personal adult sessions
  - name: Accounts
    description: Personal adult administration; recovery admin is permanent
  - name: Settings
    description: Household timezone and UniFi connection
  - name: Groups
    description: Family and Things
  - name: Devices
    description: Assigned and quarantined devices
  - name: Sync
    description: Reconciliation and per-action change status
  - name: DPI
    description: UniFi DPI category and application catalog (server-side proxy)
  - name: Rules
    description: Category and app rules including network scope (Internet parents remain groups)
  - name: Upstream
    description: Domain-list categories checked against the household resolver (reporting only)
  - name: Connection
    description: |
      Paired native devices, trusted HTTPS endpoints, and connection status.
      Administrator reads (GET) need only the session; writes also need the CSRF header.
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Deployment health
      description: Minimal non-secret readiness. Does not expose credentials. The optional update snapshot is cached GitHub release metadata and does not affect application readiness.
      security: []
      responses:
        "200":
          description: Application and database are reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              examples:
                ok:
                  value:
                    status: ok
                    db: ok
                    version: "0.1.0"
                    revision: 0
                    update:
                      status: ok
                      available: true
                      currentVersion: "0.1.0"
                      latestVersion: "0.2.0"
                      releaseUrl: https://github.com/nickberardi/familyfi/releases/tag/v0.2.0
                      releaseNotes: "## New\n- Pair Device page"
                      checkedAt: "2026-09-22T12:00:00.000Z"
                      lastSuccessfulAt: "2026-09-22T12:00:00.000Z"
                      error: null
        "503":
          description: Application is up but the database is not.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Sign in
      description: |
        Authenticate the recovery username `admin` against FAMILYFI_DEFAULT_PASSWORD,
        or a personal adult account against its stored password hash.
        Browser clients receive an httpOnly session cookie and a readable CSRF
        cookie. Native clients first claim an administrator-created pairing,
        then set `client` to `native` with their paired device ID and credential
        to receive a bearer token instead of cookies. Five failed attempts in 15 minutes for a
        username or IP return 429. A browser session lasts 30 days unless revoked. A native
        bearer lasts one hour and comes with a `refreshToken` that renews it at
        `POST /api/v1/auth/refresh` for 90 days from its last use.

        Through remote access (the Cloudflare tunnel), only `client: native` may sign
        in (403 `remote_browser_login` otherwise), and the paired device is checked
        before the password (403 `device_not_paired`, with no attempt recorded).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              browser:
                value: { username: admin, password: "example-password", client: browser }
              native:
                value: { username: admin, password: "example-password", client: native, deviceId: "paired-device-id", deviceCredential: "device-keychain-credential" }
      responses:
        "200":
          description: Authenticated.
          headers:
            Set-Cookie:
              description: Browser logins set familyfi_session (httpOnly) and familyfi_csrf.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [Auth]
      summary: Renew a paired device's bearer
      description: |
        Trades a paired device's refresh token for a new one-hour bearer and a new refresh token;
        both old tokens stop working. The refresh token lasts 90 days from its last use. The one
        just replaced is honoured once within a few seconds, for a device that lost the response;
        presenting it again after that means a copy exists, so the whole sign-in is revoked
        (403 `refresh_reused`). An unknown, expired or revoked token, or a revoked device, is
        403 `invalid_refresh`: sign in again. An agent's refresh through remote access is 403
        `agent_remote`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: A new token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Sign out
      description: |
        Revokes the current session. Cookie clients must send header
        `X-CSRF-Token` matching the `familyfi_csrf` cookie. Bearer clients
        send `Authorization: Bearer`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Session revoked.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/auth/session:
    get:
      operationId: getSession
      tags: [Auth]
      summary: Current session
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The caller is authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/accounts:
    get:
      operationId: listAccounts
      tags: [Accounts]
      summary: List recovery and personal accounts
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Accounts without password hashes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
        "401":
          $ref: "#/components/responses/Error"
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAccount
      tags: [Accounts]
      summary: Create a personal adult account
      description: Username cannot be admin. groupId must be an adult Family group.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [account, change]
                properties:
                  account: { $ref: "#/components/schemas/Account" }
                  change: { $ref: "#/components/schemas/ChangeSummary" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/accounts/{id}:
    get:
      operationId: getAccount
      tags: [Accounts]
      summary: Get an account
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AccountId" }]
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [account]
                properties:
                  account: { $ref: "#/components/schemas/Account" }
        "401":
          $ref: "#/components/responses/Error"
        "403": { $ref: "#/components/responses/Error" }
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: updateAccount
      tags: [Accounts]
      summary: Update a personal account
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [account, change]
                properties:
                  account: { $ref: "#/components/schemas/Account" }
                  change: { $ref: "#/components/schemas/ChangeSummary" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAccount
      tags: [Accounts]
      summary: Delete a personal account
      description: Revokes that account's sessions. Recovery admin cannot be deleted.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, change]
                properties:
                  ok: { type: boolean, const: true }
                  change: { $ref: "#/components/schemas/ChangeSummary" }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/accounts/{id}/password:
    put:
      operationId: updateAccountPassword
      tags: [Accounts]
      summary: Set a personal account password
      description: Revokes existing sessions for that account. Recovery admin uses FAMILYFI_DEFAULT_PASSWORD.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, minLength: 8 }
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [account, change]
                properties:
                  account: { $ref: "#/components/schemas/Account" }
                  change: { $ref: "#/components/schemas/ChangeSummary" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/settings/household:
    get:
      operationId: getHousehold
      tags: [Settings]
      summary: Household timezone and quarantine enforcement
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Household settings
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [household]
                properties:
                  household:
                    $ref: "#/components/schemas/Household"
        "401":
          $ref: "#/components/responses/Error"
        "403": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateHousehold
      tags: [Settings]
      summary: Update timezone or quarantine enforcement
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                timezone: { type: string, example: America/New_York }
                quarantineEnforced:
                  type: boolean
                  description: |
                    When false, app-owned quarantine policies are PUT enabled false (emergency override).
                    Assignment is unchanged. When true, unassigned in-scope MACs are blocked again.
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [household, change]
                properties:
                  household: { $ref: "#/components/schemas/Household" }
                  change: { $ref: "#/components/schemas/ChangeSummary" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/settings/unifi:
    get:
      operationId: getUnifiSettings
      tags: [Settings]
      summary: Masked UniFi connection
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Never returns the raw API key
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [unifi]
                properties:
                  unifi: { $ref: "#/components/schemas/UnifiSettings" }
        "401":
          $ref: "#/components/responses/Error"
        "403": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateUnifiSettings
      tags: [Settings]
      summary: Validate and save UniFi credentials or managed networks
      description: |
        Probes UniFi before saving a new key. Failure preserves the previous key.
        After a key exists, PUT may send only manageAllNetworks / managedNetworkIds.
        Discovery and quarantine only watch those UniFi networks (VLANs).
        manageAllNetworks true watches every network on the site.
        An empty allowlist with manageAllNetworks false watches none.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnifiSettingsWrite" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [unifi, change]
                properties:
                  unifi: { $ref: "#/components/schemas/UnifiSettings" }
                  change: { $ref: "#/components/schemas/ChangeSummary" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/settings/unifi/test:
    post:
      operationId: testUnifiSettings
      tags: [Settings]
      summary: Probe UniFi without saving; omit apiKey to test the stored key
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnifiProbeRequest" }
      responses:
        "200":
          description: Reachable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, applicationVersion, site, siteCount, networks]
                properties:
                  ok: { type: boolean, const: true }
                  applicationVersion: { type: string }
                  site:
                    type: object
                    additionalProperties: false
                    required: [id, name]
                    properties:
                      id: { type: string }
                      name: { type: string }
                  siteCount: { type: integer }
                  networks:
                    type: array
                    items: { $ref: "#/components/schemas/UnifiNetwork" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/groups:
    get:
      operationId: listGroups
      tags: [Groups]
      summary: List Family and Things groups
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [groups]
                properties:
                  groups:
                    type: array
                    items: { $ref: "#/components/schemas/Group" }
        "401":
          $ref: "#/components/responses/Error"
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createGroup
      tags: [Groups]
      summary: Create a group
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [group, change]
                properties:
                  group: { $ref: "#/components/schemas/Group" }
                  change: { $ref: "#/components/schemas/ChangeSummary" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/groups/{id}:
    get:
      operationId: getGroup
      tags: [Groups]
      summary: Get a group
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      responses:
        "200":
          description: Group
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [group]
                properties:
                  group: { $ref: "#/components/schemas/Group" }
        "401":
          $ref: "#/components/responses/Error"
        "403": { $ref: "#/components/responses/Error" }
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: updateGroup
      tags: [Groups]
      summary: Update a group
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/GroupId" }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [group, change]
                properties:
                  group: { $ref: "#/components/schemas/Group" }
                  change: { $ref: "#/components/schemas/ChangeSummary" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteGroup
      tags: [Groups]
      summary: Delete a group
      description: Devices in the group become quarantined.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/GroupId" }
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, change]
                properties:
                  ok: { type: boolean, const: true }
                  change: { $ref: "#/components/schemas/ChangeSummary" }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/dpi/categories:
    get:
      operationId: listDpiCategories
      tags: [DPI]
      summary: List UniFi DPI categories
      description: |
        Proxies UniFi `GET /v1/dpi/categories`. Returns integer ids and catalog
        names. Includes confirmed curated slots (Video / Social / Gaming / VPN /
        Messaging; no Porn curated slot). Secrets never leave the server.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: filter
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: DPI categories
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [categories, curated]
                properties:
                  categories:
                    type: array
                    items: { $ref: "#/components/schemas/DpiCatalogItem" }
                  curated: { $ref: "#/components/schemas/CuratedCategoryMap" }
        "401":
          $ref: "#/components/responses/Error"
        "403": { $ref: "#/components/responses/Error" }
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/dpi/applications:
    get:
      operationId: listDpiApplications
      tags: [DPI]
      summary: List UniFi DPI applications
      description: Proxies UniFi `GET /v1/dpi/applications` with optional name filter.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: filter
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: DPI applications
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [applications]
                properties:
                  applications:
                    type: array
                    items: { $ref: "#/components/schemas/DpiCatalogItem" }
        "401":
          $ref: "#/components/responses/Error"
        "403": { $ref: "#/components/responses/Error" }
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/rules:
    get:
      operationId: listRules
      tags: [Rules]
      summary: List rules
      description: Every rule, household-wide. `groupId` narrows to the rules covering that group.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: groupId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [rules]
                properties:
                  rules:
                    type: array
                    items: { $ref: "#/components/schemas/Rule" }
        "401":
          $ref: "#/components/responses/Error"
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createRule
      tags: [Rules]
      summary: Create a rule
      description: |
        A rule blocks all internet, DPI categories, apps or websites for one or more
        groups (or managed networks), always or in named recurring windows. Each window
        is its own UniFi policy. Category and app rules store UniFi DPI integer ids.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleCreate" }
            examples:
              bedtime:
                value:
                  name: School nights
                  kind: internet
                  groupIds: [grp_example]
                  mode: scheduled
                  windows: [{ name: "", days: [0, 1, 2, 3, 4], start: "21:00", end: "07:00" }]
              category:
                value: { name: TV video evenings, kind: category, groupIds: [grp_tv], targetIds: [4], mode: scheduled, windows: [{ name: After school, days: [1, 2, 3, 4, 5], start: "16:00", end: "18:00" }] }
              website:
                value: { name: No TikTok, kind: domain, groupIds: [grp_example], domains: [tiktok.com], mode: always }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [rule, change]
                properties:
