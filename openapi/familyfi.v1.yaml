            examples:
              bedtime:
                value:
                  name: School nights
                  kind: internet
                  groupIds: [grp_example]
                  mode: scheduled
                  windows: [{ name: "", days: [0, 1, 2, 3, 4], start: "21:00", end: "07:00" }]
              category:
                value: { name: TV video evenings, kind: category, groupIds: [grp_tv], targetIds: [4], mode: scheduled, windows: [{ name: After school, days: [1, 2, 3, 4, 5], start: "16:00", end: "18:00" }] }
